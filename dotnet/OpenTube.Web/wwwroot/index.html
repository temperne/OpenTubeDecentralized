<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenTube</title>
    <base href="/app/" />
    <meta name="theme-color" content="#e5484d" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="_content/OpenTube.UI/opentube.css" />
    <style>
      /* The loading screen: inline, so it shows before anything else downloads. Blazor sets --blazor-load-percentage. */
      .boot-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px;
        background: #f6f7f9; color: #16181d; font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; text-align: center; }
      @media (prefers-color-scheme: dark) { .boot-screen { background: #111317; color: #eceef2; } .boot-bar { background: #2a2e36; } }
      .boot-mark { width: 96px; height: 96px; animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot-mark .n { animation: boot-node 1.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .boot-mark .n2 { animation-delay: .2s; } .boot-mark .n3 { animation-delay: .4s; }
      @keyframes boot-node { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
      @keyframes boot-pulse { 0%, 100% { filter: drop-shadow(0 0 0 rgba(229,72,77,0)); } 50% { filter: drop-shadow(0 0 14px rgba(229,72,77,.45)); } }
      .boot-name { font-weight: 800; font-size: 28px; letter-spacing: -.01em; } .boot-name span { color: #e5484d; }
      .boot-bar { width: min(280px, 100%); height: 6px; border-radius: 99px; background: #e5e7eb; overflow: hidden; }
      .boot-bar i { display: block; height: 100%; width: var(--blazor-load-percentage, 4%); background: #e5484d; border-radius: 99px; transition: width .2s; }
      .boot-pct::after { content: var(--blazor-load-percentage-text, ""); }
      .boot-sub { color: #6b7280; font-size: 13px; min-height: 1.4em; }
      @media (prefers-reduced-motion: reduce) { .boot-mark, .boot-mark .n { animation: none; } }
    </style>
    <script type="importmap"></script>
</head>
<body>
    <div id="app">
      <div class="boot-screen" role="status" aria-live="polite">
        <svg class="boot-mark" viewBox="0 0 128 128" aria-hidden="true">
          <rect width="128" height="128" rx="28" fill="#e5484d"/>
          <path d="M44 34 L94 64 L44 94 Z" fill="#fff" fill-opacity=".22" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>
          <circle class="n" cx="44" cy="34" r="11" fill="#fff"/><circle class="n n2" cx="94" cy="64" r="11" fill="#fff"/><circle class="n n3" cx="44" cy="94" r="11" fill="#fff"/>
        </svg>
        <div class="boot-name">Open<span>Tube</span></div>
        <div class="boot-bar"><i></i></div>
        <div class="boot-sub" id="boot-sub">Downloading the app <span class="boot-pct"></span></div>
      </div>
    </div>
    <div id="blazor-error-ui" style="display:none;position:fixed;left:0;right:0;bottom:0;padding:12px 16px;background:#e5484d;color:#fff;z-index:9;font:14px system-ui">
      Something went wrong loading OpenTube. <a href="" style="color:#fff;font-weight:700">Reload</a>
    </div>
    <script>
      // Once the download is done, the app is still starting (keys, chains, the network): say so.
      (function () {
        var t = setInterval(function () {
          var sub = document.getElementById('boot-sub'); if (!sub) return clearInterval(t);
          var p = getComputedStyle(document.documentElement).getPropertyValue('--blazor-load-percentage').trim();
          if (p === '100%') { sub.textContent = 'Starting: your keys, the chains and the network…'; clearInterval(t); }
        }, 250);
      })();
    </script>
    <script src="opentube.js"></script>
    <script src="_content/OpenTube.UI/opentube-ui.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
</html>
