<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenTube</title>
<meta name="description" content="A serverless video platform where every browser is a blockchain node and a video host.">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1f232c; --border: #2a2f3a;
    --text: #e8eaf0; --muted: #9aa3b2; --accent: #ff4d5e; --accent-2: #3ea6ff; --ok: #3ecf8e; --warn: #f5a524;
    --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7f9; --panel: #ffffff; --panel-2: #eef0f4; --border: #dde1e8; --text: #15181e; --muted: #5b6475; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { position: sticky; top: 0; z-index: 10; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .logo { font-weight: 800; font-size: 20px; letter-spacing: -0.5px; white-space: nowrap; color: var(--text); }
  .logo span { color: var(--accent); }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav a { padding: 6px 12px; border-radius: 8px; color: var(--text); }
  nav a.active { background: var(--panel-2); }
  .status { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 5px; vertical-align: middle; }
  .dot.on { background: var(--ok); } .dot.busy { background: var(--warn); } .dot.bad { background: var(--accent); }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.ok { background: rgba(62,207,142,.15); color: var(--ok); } .pill.warn { background: rgba(245,165,36,.15); color: var(--warn); } .pill.error { background: rgba(255,77,94,.15); color: var(--accent); }
  .check { display: grid; grid-template-columns: 110px 1fr; gap: 4px 14px; padding: 10px 0; border-top: 1px solid var(--border); }
  .check:first-child { border-top: 0; }
  .check .fix { color: var(--muted); font-size: 13px; }
  table.diag { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.diag th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  table.diag td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .tablewrap { overflow-x: auto; }
  .log { font-family: ui-monospace, monospace; font-size: 12px; max-height: 320px; overflow: auto; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); padding: 7px 14px; border-radius: 8px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.on { border-color: var(--ok); color: var(--ok); }
  button.small { padding: 3px 9px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
  h1, h2, h3 { line-height: 1.25; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; color: var(--text); display: block; }
  .card:hover { text-decoration: none; border-color: var(--muted); }
  .thumb { aspect-ratio: 16/9; background: #000 center/cover no-repeat; display: grid; place-items: center; color: #666; font-size: 32px; }
  .card .meta { padding: 10px 12px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--muted); font-size: 13px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 18px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--panel-2) center/cover; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 22px; color: var(--muted); }
  .avatar.sm { width: 36px; height: 36px; font-size: 15px; }
  .chan-row { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 10px; color: var(--text); }
  .chan-row:hover { background: var(--panel-2); text-decoration: none; }
  .fp { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .badge.ok { color: var(--ok); border-color: var(--ok); } .badge.warn { color: var(--warn); border-color: var(--warn); }
  .watch { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; }
  @media (max-width: 900px) { .watch { grid-template-columns: 1fr; } }
  video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: var(--radius); display: block; }
  .bar { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; margin-top: 4px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 8px 0; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  input[type=text], input[type=search], input[type=number], textarea, select { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font: inherit; }
  textarea { min-height: 80px; resize: vertical; }
  .drop { border: 2px dashed var(--border); border-radius: var(--radius); padding: 24px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .item { border-top: 1px solid var(--border); padding: 10px 0; }
  .item:first-child { border-top: 0; }
  .item p, .pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; }
  .hidden-item { opacity: .45; }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin: 16px 0; }
  .tabs a { padding: 8px 14px; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs a.active { color: var(--text); border-color: var(--accent); }
  code, .mono { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 13px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--border); padding: 10px 18px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); z-index: 20; }
  #toast.show { opacity: 1; }
  .hidden { display: none !important; }
  .ccard { padding: 16px; text-align: center; }
  .ccard .avatar { margin: 0 auto 10px; width: 72px; height: 72px; font-size: 28px; }
  .ccard p { margin: 6px 0 0; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar input[type=search] { flex: 1 1 260px; width: auto; }
  .toolbar select { width: auto; }
  .votes { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .votes button { border: 0; border-radius: 0; background: var(--panel-2); padding: 6px 14px; }
  .votes button + button { border-left: 1px solid var(--border); }
  .votes button.mine { color: var(--accent-2); font-weight: 700; }
  .rank-n { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.7); color: #fff; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 6px; }
  .thumb { position: relative; }
  .bal { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  .meter { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin: 6px 0; }
  .meter > div { height: 100%; background: var(--ok); }
  .tx { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .tx:first-child { border-top: 0; }
  .amt-in { color: var(--ok); font-weight: 700; } .amt-out { color: var(--accent); font-weight: 700; }
  #folderbar { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 10px 16px; background: var(--panel-2); border-bottom: 1px solid var(--warn); font-size: 14px; }
  #folderbar.hidden { display: none; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 800px) { .split { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <a class="logo" href="#/">Open<span>Tube</span></a>
  <nav>
    <a href="#/" data-nav="home">Feed</a>
    <a href="#/explore" data-nav="explore">Explore</a>
    <a href="#/wallet" data-nav="wallet">Wallet</a>
    <a href="#/me" data-nav="me">My node</a>
    <a href="#/network" data-nav="network">Network</a>
  </nav>
  <a class="status" href="#/network" title="Network & diagnostics" style="color:inherit;text-decoration:none">
    <span><span class="dot" id="dot-health"></span><span id="st-health">checking…</span></span>
    <span><span class="dot" id="dot-net"></span><span id="st-net">connecting…</span></span>
    <span><span class="dot" id="dot-chain"></span><span id="st-chain">main chain…</span></span>
    <span id="st-p2p"></span>
  </a>
</header>
<div id="folderbar" class="hidden"></div>
<main id="app"><div class="empty">Starting node…</div></main>
<div id="toast"></div>
<!--
  ===================================================================== OPENTUBE CORE
  The blockchain rules. This script touches no DOM or browser storage, so
  server.mjs extracts this exact block from the HTML and runs it too. Browser
  nodes and server nodes enforce identical rules from one source.

  MAIN CHAIN    proof of work, kept by every node. Each block registers
                channels and lists by embedding their full signed genesis blocks.
  CHANNEL/LIST  one chain per channel or list, controlled by the owner's key.
  CHAINS        Blocks form a hash-linked DAG (several parents allowed) so
                approved commenters can append at the same time. Nothing is
                ever deleted: "hide" is a signed record that every node honours.
  ===================================================================== -->
<script id="opentube-core">
(() => {
// Changing anything in MAIN_GENESIS creates a different network: its hash is the network ID.
const MAIN_GENESIS = {
  v: 1, chain: null, parents: [], height: 0, ts: 1794960000000, author: null, nonce: 0,
  payload: {
    type: 'genesis', kind: 'main',
    name: 'OpenTube Main Chain',
    difficulty: 18,          // leading zero bits required on main-chain blocks
    commentDifficulty: 10,   // anti-spam work on blocks written by non-owners
    maxEntries: 16,          // registrations per main block
    trackers: [
      'wss://tracker.openwebtorrent.com',
      'wss://tracker.webtorrent.dev',
      'wss://tracker.btorrent.xyz',
      'wss://tracker.files.fm:7073/announce'
    ]
  }
};
const LIMITS = { blockBytes: 300000, name: 60, about: 2000, title: 140, text: 5000, comment: 1000, image: 60000, parents: 8, batchBytes: 4000000, orphans: 5000 };

// ---- primitives
const enc = new TextEncoder();
const hex = (buf) => Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
const sha256hex = async (s) => hex(await crypto.subtle.digest('SHA-256', enc.encode(s)));
// Canonical JSON: sorted keys, so every node hashes identical bytes.
const canon = (v) => v === null || typeof v !== 'object' ? JSON.stringify(v)
  : Array.isArray(v) ? '[' + v.map(canon).join(',') + ']'
  : '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
const zeroBits = (hexStr) => { let z = 0; for (const c of hexStr) { const n = parseInt(c, 16); if (n === 0) { z += 4; continue; } return z + Math.clz32(n) - 28; } return z; };
const isStr = (v, max) => typeof v === 'string' && v.length <= max;
const isImg = (v) => v === '' || (typeof v === 'string' && v.length <= LIMITS.image && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v));
const isHex = (v, len) => typeof v === 'string' && v.length === len && /^[0-9a-f]+$/.test(v);
const isKey = (v) => typeof v === 'string' && /^[A-Za-z0-9_-]{43}$/.test(v);
const b64u = {
  enc: (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
  dec: (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0))
};
const ED = { name: 'Ed25519' };
const pubKeys = new Map();
async function verify(pub, msg, sig) {
  try {
    let k = pubKeys.get(pub);
    if (!k) { k = await crypto.subtle.importKey('raw', b64u.dec(pub), ED, false, ['verify']); pubKeys.set(pub, k); }
    return await crypto.subtle.verify(ED, k, b64u.dec(sig), enc.encode(msg));
  } catch { return false; }
}
async function newIdentity() {
  const kp = await crypto.subtle.generateKey(ED, true, ['sign', 'verify']);
  return { pub: b64u.enc(await crypto.subtle.exportKey('raw', kp.publicKey)), priv: b64u.enc(await crypto.subtle.exportKey('pkcs8', kp.privateKey)) };
}
async function signer(identity) {
  const key = await crypto.subtle.importKey('pkcs8', b64u.dec(identity.priv), ED, false, ['sign']);
  return { pub: identity.pub, sign: async (msg) => b64u.enc(await crypto.subtle.sign(ED, key, enc.encode(msg))) };
}

// ---- blocks: hash = sha256(canon(block minus hash/sig/nonce) + ':' + nonce); sig = Ed25519(author, hash)
const preimage = (b) => { const { hash, sig, nonce, ...rest } = b; return canon(rest) + ':'; };
const hashBlock = (b) => sha256hex(preimage(b) + b.nonce);

class Chain {
  constructor(id, genesis) {
    this.id = id; this.genesis = genesis;
    this.blocks = new Map([[id, genesis]]);
    this.children = new Map();
    this.heads = new Set([id]);
    this.orphans = new Map();   // blocks waiting for their parents
    this.version = 0;           // bumps on every change; used to cache derived state
    // Diagnostics: what we've heard about this chain from peers and how syncing is going.
    this.stats = { announces: 0, lastAnnounce: 0, lastBlock: 0, lastRequest: 0, lastResponse: 0, unknownHeads: [], accepted: 0, rejected: 0, lastReject: '' };
  }
  get owner() { return this.genesis.author; }
  has(hash) { return this.blocks.has(hash); }
  ancestors(hashes, into = new Set()) {
    const stack = [...hashes];
    while (stack.length) { const x = stack.pop(); if (into.has(x) || !this.blocks.has(x)) continue; into.add(x); stack.push(...this.blocks.get(x).parents); }
    return into;
  }
  add(b) {
    this.blocks.set(b.hash, b);
    for (const p of b.parents) { this.heads.delete(p); (this.children.get(p) || this.children.set(p, []).get(p)).push(b.hash); }
    if (!this.children.has(b.hash)) this.heads.add(b.hash);
    this.version++;
  }
  // Blocks a peer is missing: ancestors of `want` minus ancestors of the peer's `have`.
  missingFor(want, have) {
    const exclude = this.ancestors(have.filter(x => this.blocks.has(x)));
    const out = [...this.ancestors(want.filter(x => this.blocks.has(x)))].filter(x => !exclude.has(x) && x !== this.id).map(x => this.blocks.get(x));
    out.sort((a, b) => a.height - b.height || a.ts - b.ts);
    const res = []; let bytes = 0;
    for (const b of out) { bytes += canon(b).length; if (bytes > LIMITS.batchBytes) break; res.push(b); }
    return res;
  }
}

function validGenesis(g) {
  if (!g || g.v !== 1 || g.chain !== null || !Array.isArray(g.parents) || g.parents.length || g.height !== 0 || !isKey(g.author)) return false;
  const p = g.payload;
  if (!p || p.type !== 'genesis' || !['channel', 'list'].includes(p.kind)) return false;
  if (!isStr(p.name, LIMITS.name) || !p.name.trim() || !isStr(p.about, LIMITS.about)) return false;
  if (p.kind === 'channel' && (!isImg(p.avatar) || !['anyone', 'approved', 'off'].includes(p.comments))) return false;
  if (p.kind === 'list' && p.ranking !== undefined && p.ranking !== true) return false;
  return true;
}
async function checkSigned(b) {
  if (!b || typeof b !== 'object' || !isHex(b.hash, 64) || typeof b.sig !== 'string' || !Number.isSafeInteger(b.nonce) || !Number.isSafeInteger(b.ts) || !Number.isSafeInteger(b.height)) return false;
  if (canon(b).length > LIMITS.blockBytes) return false;
  if (b.ts > Date.now() + 10 * 60000) return false;
  if (await hashBlock(b) !== b.hash) return false;
  return verify(b.author, b.hash, b.sig);
}
function validPayload(chain, b, CFG) {
  const p = b.payload; if (!p || typeof p !== 'object') return false;
  const owner = b.author === chain.owner;
  const kind = chain.genesis.payload.kind;
  if (!owner) {
    if (kind !== 'channel' || zeroBits(b.hash) < CFG.commentDifficulty) return false;
    if (p.type === 'comment') return isHex(p.target, 64) && isStr(p.text, LIMITS.comment) && p.text.trim().length > 0 && isStr(p.name ?? '', LIMITS.name) && permittedAt(chain, b);
    if (p.type === 'hide') return isHex(p.target, 64) && permittedAt(chain, b);
    if (p.type === 'vote') return isHex(p.target, 64) && [1, 0, -1].includes(p.v) && permittedAt(chain, b);
    return false;
  }
  switch (p.type) {
    case 'video': return kind === 'channel' && isStr(p.title, LIMITS.title) && isStr(p.desc, LIMITS.text) && isHex(p.infohash, 40) && isStr(p.file, 200) && Number.isSafeInteger(p.size) && isImg(p.thumb) && (p.comments === undefined || ['anyone', 'approved', 'off'].includes(p.comments));
    case 'settings': return kind === 'channel' && isHex(p.target, 64) && ['default', 'anyone', 'approved', 'off'].includes(p.comments);
    case 'post': return isStr(p.text, LIMITS.text) && p.text.trim().length > 0;
    case 'comment': return isHex(p.target, 64) && isStr(p.text, LIMITS.comment) && p.text.trim().length > 0;
    case 'hide': return isHex(p.target, 64);
    case 'allow': case 'revoke': return isKey(p.key);
    case 'profile': return (p.name === undefined || (isStr(p.name, LIMITS.name) && p.name.trim().length > 0)) && (p.about === undefined || isStr(p.about, LIMITS.about)) && (p.avatar === undefined || isImg(p.avatar)) && (p.comments === undefined || ['anyone', 'approved', 'off'].includes(p.comments));
    case 'add': return kind === 'list' && isHex(p.target, 64) && isStr(p.note ?? '', LIMITS.about);
    case 'vote': return kind === 'channel' && isHex(p.target, 64) && [1, 0, -1].includes(p.v);
    // An ad. Its terms (price per view, max views…) are signed separately by the same key so a viewer's
    // claim can carry them to the main chain without the whole block.
    case 'ad': return kind === 'channel' && isStr(p.title, LIMITS.title) && isStr(p.file, 200) && isImg(p.thumb)
      && isStr(p.url, 300) && (p.url === '' || /^https:\/\/[^\s]+$/.test(p.url)) && termsShape(p.terms) && p.terms.advertiser === b.author && p.terms.channel === chain.id;
    // Run this advertiser's ads on this channel (or, for a list, on every channel in the list).
    case 'sponsor': return isHex(p.advertiser, 64);
    default: return false;
  }
}

// One vote per key per video: the latest one (by height, then time) counts.
function tallyVotes(blocks) {
  const latest = new Map();  // video -> Map(author -> block)
  for (const b of blocks) if (b.payload.type === 'vote') {
    const m = latest.get(b.payload.target) || latest.set(b.payload.target, new Map()).get(b.payload.target);
    const prev = m.get(b.author);
    if (!prev || b.height > prev.height || (b.height === prev.height && b.ts > prev.ts)) m.set(b.author, b);
  }
  const out = new Map();
  for (const [video, m] of latest) {
    let up = 0, down = 0; const by = new Map();
    for (const [author, b] of m) { if (b.payload.v > 0) up++; else if (b.payload.v < 0) down++; by.set(author, b.payload.v); }
    out.set(video, { up, down, by });
  }
  return out;
}

// ---- rankings
// A ranking is computed by a ranking list's owner and published as a signed snapshot. Only the latest
// snapshot per list is kept and gossiped, so rankings never bloat chain history, and anyone can
// verify the list's key signed it.
const RANK = { items: 200, title: 140 };
function validRanking(r, listGenesis) {
  if (!r || typeof r !== 'object' || r.v !== 1 || !isHex(r.list, 64) || !Number.isSafeInteger(r.at) || r.at > Date.now() + 10 * 60000) return false;
  if (!listGenesis || listGenesis.payload.kind !== 'list' || listGenesis.payload.ranking !== true || r.author !== listGenesis.author) return false;
  if (!isStr(r.algo, 40) || !Array.isArray(r.items) || r.items.length > RANK.items || canon(r).length > 200000) return false;
  return r.items.every(i => i && isHex(i.c, 64) && isHex(i.v, 64) && isStr(i.t, RANK.title) && isStr(i.n, LIMITS.name)
    && Number.isFinite(i.s) && Number.isSafeInteger(i.up) && Number.isSafeInteger(i.down) && Number.isSafeInteger(i.ts));
}
const rankingPreimage = (r) => { const { sig, ...rest } = r; return 'opentube-ranking:' + canon(rest); };

// ---- the token ledger (transactions ride in main-chain blocks)
// Every identity issues its OWN token. Its "free balance" is LEDGER.cap minus how many of its tokens
// are out in other people's hands. Spending your own token sends it out; when it comes back to you
// (someone pays you in it) or someone burns it, your free balance recovers. Tokens of other issuers
// that you receive are "holdings": spend them, sell them back to their issuer, or burn them.
// Selling back is how tokens become money: an advertiser buys back tokens its ads put out (paying

// ---- ads and proof of watching
// Ad TERMS are signed by the advertiser's channel key. Viewers who watch an ad in the same time slot
// form a group: each second they exchange a hash of the ad file's bytes for that second, and at the end
// each signs a WITNESS statement naming who stayed in sync. A viewer with enough witnesses from other
// keys submits a CLAIM transaction; the ledger then moves the advertiser's tokens, half to the viewer and
// half to the creator of the video the ad ran with.

    && Number.isSafeInteger(t.size) && t.size > 0 && Number.isSafeInteger(t.duration) && t.duration >= 1 && t.duration <= ADS.maxDuration
    && Number.isSafeInteger(t.perView) && t.perView >= 2 && t.perView <= ADS.maxPerView && Number.isSafeInteger(t.maxViews) && t.maxViews >= 1 && t.maxViews <= 1e6

    && isHex(w.video, 64) && isKey(w.creator) && isKey(w.witness) && Array.isArray(w.saw) && w.saw.length <= 50 && w.saw.every(isKey) && typeof w.sig === 'string';

      const ageH = Math.max(0, now - v.ts) / 3600000;

// ---- a WebTorrent-compatible tracker, so a home node can introduce video peers itself.
// Speaks the WebSocket tracker protocol: announce with WebRTC offers, relay answers, scrape.
function createTracker() {
  const swarms = new Map();   // info_hash -> Map(peer_id -> socket id)

        return;

// Network-level enforcement: every node checks a non-owner block against the owner's
// rules as they stood in that block's own history. Blocks that fail are rejected:
// not stored, not relayed. (derive() additionally applies later revokes and "off"
// switches when displaying, so picking old parents can't dodge them.)
function permittedAt(chain, b) {
  const owner = chain.owner;
  const history = chain.ancestors(b.parents);
  const ownerBlocks = [...history].map(x => chain.blocks.get(x)).filter(x => x.author === owner && x.hash !== chain.id)
    .sort((x, y) => x.height - y.height || x.ts - y.ts || (x.hash < y.hash ? -1 : 1));
  let def = chain.genesis.payload.comments;
  const videoPolicy = new Map(), allowed = new Set(), revoked = new Set();
  for (const x of ownerBlocks) {
    const p = x.payload;
    if (p.type === 'profile' && p.comments) def = p.comments;
    if (p.type === 'video' && p.comments) videoPolicy.set(x.hash, p.comments);
    if (p.type === 'settings') { if (p.comments === 'default') videoPolicy.delete(p.target); else videoPolicy.set(p.target, p.comments); }
    if (p.type === 'allow') { allowed.add(p.key); revoked.delete(p.key); }
    if (p.type === 'revoke') { revoked.add(p.key); allowed.delete(p.key); }
  }
  if (revoked.has(b.author) || !history.has(b.payload.target)) return false;
  const target = chain.blocks.get(b.payload.target);
  if (b.payload.type === 'hide') return target.author === b.author;              // only your own comments
  if (target.author !== owner || target.payload.type !== 'video') return false;  // comments and votes attach to the channel's videos
  if (b.payload.type === 'vote') return true;                                   // anyone not revoked may vote
  const pol = videoPolicy.get(target.hash) ?? def;
  return pol === 'anyone' || (pol === 'approved' && allowed.has(b.author));
}

// What a channel/list looks like after applying every rule (permissions, hides, profile edits).
function derive(c) {
  if (c._derived && c._derived.version === c.version) return c._derived;
  const owner = c.owner;
  const blocks = [...c.blocks.values()].filter(b => b.hash !== c.id).sort((a, b) => a.height - b.height || a.ts - b.ts || (a.hash < b.hash ? -1 : 1));
  const profile = { ...c.genesis.payload };
  const allowed = new Set(), revokes = [];
  const videoPolicy = new Map();  // video block hash -> comment policy overriding the channel default
  for (const b of blocks) if (b.author === owner) {
    const p = b.payload;
    if (p.type === 'video' && p.comments) videoPolicy.set(b.hash, p.comments);
    if (p.type === 'settings') { if (p.comments === 'default') videoPolicy.delete(p.target); else videoPolicy.set(p.target, p.comments); }
    if (p.type === 'profile') for (const k of ['name', 'about', 'avatar', 'comments']) if (p[k] !== undefined) profile[k] = p[k];
    if (p.type === 'allow') allowed.add(p.key);

    return pol === 'anyone' || (pol === 'approved' && allowed.has(key));
  };

    if (b.author === owner) return true;
    if (revokes.some(r => r.key === b.author && !r.before.has(b.hash))) return false;
    if (b.payload.type === 'hide' || b.payload.type === 'vote') return true;  // own-comment hides and votes need no comment permission
    return allows(b.author, b.payload.target);

    version: c.version, id: c.id, kind: c.genesis.payload.kind, owner, profile, allowed, revoked: new Set(revokes.map(r => r.key)), hidden,
    videos: live.filter(b => b.payload.type === 'video' && b.author === owner).reverse(),
    posts: live.filter(b => b.payload.type === 'post' && b.author === owner).reverse(),
    adds: live.filter(b => b.payload.type === 'add' && b.author === owner).reverse(),
    ads: live.filter(b => b.payload.type === 'ad' && b.author === owner).reverse(),
    sponsors: live.filter(b => b.payload.type === 'sponsor' && b.author === owner).reverse(),
    commentsFor: (target) => visible.filter(b => b.payload.type === 'comment' && b.payload.target === target),
    votes: tallyVotes(visible),
    policyFor, videoPolicy,
    canComment: (key, target) => key === owner || (!revokes.some(r => r.key === key) && allows(key, target)),
    blockCount: c.blocks.size

}

/* ---- the node engine. Host environments plug in:

     mine(body, bits, onProg)  -> {promise<nonce>, cancel}
     shouldMine(genesis)       which pending registrations this node spends work on
     persist(chainId, block)   store a newly accepted block
     onBlock(chain, block)     after a block is accepted
     onChange()                something changed (UI refresh)

  const ledgerCache = new Map();   // block hash -> Ledger after that block

    const txs = p.txs === undefined ? [] : p.txs;

    const st = new Ledger(before);

    const path = [];

    for (const b of path.reverse()) for (const g of b.payload.entries) if (!d.has(g.hash)) d.set(g.hash, { genesis: g, height: b.height, ts: b.ts });

async function seedLegacy() {
  for (const f of await legacyFiles()) {
    if (hosting.has(f.infohash)) continue;
    try { await seedFile(f.chain, f.infohash, { getFile: async () => f.blob }, { name: f.name, type: f.type, size: f.size }, null); } catch (e) { console.warn('legacy video', e); }
  }
}
async function migrateLegacy() {
  for (const f of await legacyFiles()) {
    try {
      const ch = await channelFolder(f.chain);
      if (!ch.meta.videos[f.infohash]) {
        const name = await uniqueFileName(ch, f.name);
        await f.blob.stream().pipeTo(await (await ch.dir.getFileHandle(name, { create: true })).createWritable());
        ch.meta.videos[f.infohash] = { file: name, name: f.name, type: f.type, size: f.size, complete: true, own: isMine(genesisFor(f.chain)?.author), ts: f.ts || Date.now() };
        const old = getTorrent(f.infohash);
        if (old?.torrentFile) await saveTorrentFile(ch, f.infohash, old.torrentFile);
        old?.destroy(); hosting.delete(f.infohash);
        await saveMeta(ch);

  }
}

function probeTrackers() {

    let ws; try { ws = new WebSocket(url); } catch (e) { diag.trackers.set(url, { ok: false, err: 'invalid URL', at: Date.now() }); continue; }
    const done = (ok, err) => { if (diag.trackers.get(url)?.pending !== t0) return; diag.trackers.set(url, { ok, err, ms: Math.round(performance.now() - t0), at: Date.now() }); try { ws.close(); } catch {} };

    }

    const settled = advs.every(a => chains.has(a) && chains.get(a).stats.lastAnnounce && E.syncState(chains.get(a)).state === 'synced');

      await sleepUntil(start + i * 1000 + 300);
      if (!alive() || ended) return finish({ ok: false, text: '' });
      if (!player.paused && player.currentTime >= i - 1.5 && document.visibilityState === 'visible') { E.send({ t: 'watch', s: session, k: me.pub, i, h: await hashAt(i) }); sent++; }
      status.textContent = `Ad · ${t.duration - i} s left`;
      syncInfo.textContent = `· in sync with ${inSync()} other viewer(s)`;
    }
    await sleepUntil(start + t.duration * 1000 + 2000);
    if (!alive() || ended) return finish({ ok: false, text: '' });
    // 4. Sign what we saw; collect what others saw about us.
    const saw = [...matches].filter(([, x]) => x.size >= need).map(([k]) => k);
    if (sent >= need) E.send({ t: 'watch', s: session, w: await E.signWitness({ v: 1, kind: 'witness', session, terms: ad.tid, slot, video, creator, witness: me.pub, saw }) });
    status.textContent = 'Ad finished · collecting confirmations from the other viewers…'; syncInfo.textContent = '';
    await new Promise(r => setTimeout(r, 4000));
    if (!alive()) return finish({ ok: false, text: '' });
    const ws = [...witnesses.values()].slice(0, E.ADS.maxWitnesses);
    if (sent < need) return finish({ ok: false, text: 'Not counted: the ad was not playing (and visible) for enough of the time.' });
    if (ws.length < E.ADS.minWitnesses) return finish({ ok: false, text: `Not counted: no other viewer watched this ad in sync with you (needs ${E.ADS.minWitnesses}). Views are verified by other viewers.` });
    try {
      await E.submitTx({ claim: { terms: t, slot, video, creator, witnesses: ws } });
      const half = Math.floor(t.perView / 2);
      finish({ ok: true, text: `✅ View verified by ${ws.length} other viewer(s). You earn ${half} ${ad.name} tokens and the video’s creator earns ${t.perView - half} once the claim is mined.` });
    } catch (e) { finish({ ok: false, text: 'Claim rejected: ' + e.message }); }
  });
}

  return h('div', {},
    h('h2', { style: 'margin-top:0' }, 'My node'),
    h('div', { class: 'panel', style: unbacked ? 'border-color:var(--warn)' : '' },
      h('div', { class: 'row', style: 'justify-content:space-between' }, h('h3', { style: 'margin:0' }, 'Keys & backup'),
        unbacked ? h('span', { class: 'badge warn' }, `${unbacked} key${unbacked === 1 ? '' : 's'} not backed up`) : h('span', { class: 'badge ok' }, 'all keys backed up')),
      h('p', { class: 'sub' }, 'Your keys exist only in this browser. Whoever holds a channel’s private key controls that channel. “Back up all keys” saves your personal key and every channel and list key in one file. “Import keys” accepts that file, or any single key file, on another browser.'),
      h('div', { class: 'row' },
        h('button', { class: 'primary', onclick: backupAllKeys }, 'Back up all keys'),
        h('button', { onclick: () => importIn.click() }, 'Import keys'), importIn)),
    folderPanel(),
    h('div', { class: 'panel' }, h('h3', { style: 'margin-top:0' }, 'Your channels & lists'),
      owned.length ? owned.map(id => { const owner = genesisFor(id).author; return h('div', { class: 'row' }, h('div', { style: 'flex:1;min-width:220px' }, chanRow(id)),
        h('span', { class: 'sub' }, owner === me.pub ? 'personal key' : 'own key'),
        h('button', { class: 'small', onclick: () => exportChannelKey(id) }, keyExported(owner) ? 'Export key' : 'Export key ⚠')); })
        : h('div', { class: 'sub' }, 'None yet. Create one below, or import a key.')),
    h('div', { class: 'split' },
      h('div', { class: 'panel' }, h('h3', { style: 'margin-top:0' }, 'Your user ID'),
        h('p', { class: 'sub' }, 'Your personal public key. It identifies you when you comment, and it’s what you give a server to host for you. The private half is included in “Back up all keys”.'),
        h('div', { class: 'mono', style: 'padding:8px;background:var(--panel-2);border-radius:6px' }, me.pub),
        h('div', { class: 'row', style: 'margin-top:10px' },
          h('button', { onclick: () => navigator.clipboard?.writeText(me.pub).then(() => toast('User ID copied')) }, 'Copy user ID')),
        h('h4', { style: 'margin-bottom:4px' }, 'Host from a server, around the clock'),
        h('p', { class: 'sub', style: 'margin-top:0' }, `A server running this page headless can act as you: it joins every channel you join (${joinedList().length} now) and keeps their videos online when your browser is closed. Run:`),
        h('div', { class: 'mono', style: 'padding:8px;background:var(--panel-2);border-radius:6px' }, `node headless.mjs ${location.origin}${location.pathname} ${me.pub}`),
        h('p', { class: 'sub' }, E.memberships.get(me.pub) ? `Your joined-channel list was last published ${ago(E.memberships.get(me.pub).at)}. Note: this list is public.` : 'You haven’t joined any channels yet.'),
        h('label', {}, 'Display name for comments'), nameIn,
        h('label', {}, 'Storage limit per joined channel (GB)'), cap,
        h('button', { style: 'margin-top:10px', onclick: () => { settings.name = nameIn.value.trim().slice(0, LIMITS.name) || settings.name; settings.hostCapGB = Math.max(1, Number(cap.value) || 5); saveSettings(); toast('Saved'); } }, 'Save')),
      h('div', { class: 'panel' }, h('h3', { style: 'margin-top:0' }, 'Create a channel or list'),
        h('p', { class: 'sub' }, `This creates a new key pair and a new chain whose genesis block it signs. The whole genesis block is embedded in a main-chain block, which your browser mines (proof of work, ${CFG.difficulty} bits). That usually takes seconds to a minute.`),
        h('label', {}, 'Type'), kind, h('label', {}, 'Name'), name, h('label', {}, 'About'), about, chanOnly,
        h('div', { style: 'margin-top:12px' }, create))),
    h('div', { class: 'panel' }, h('h3', { style: 'margin-top:0' }, 'Subscriptions'), Object.keys(subs).length ? Object.keys(subs).map(chanRow) : h('div', { class: 'sub' }, 'None yet.')),
    h('div', { class: 'panel' }, h('h3', { style: 'margin-top:0' }, 'Node'),
      h('div', { class: 'kv' },
        h('div', {}, 'Network ID'), h('div', { class: 'mono' }, MAIN_ID),
        h('div', {}, 'Main chain'), h('div', {}, `height ${main.best.height}, ${main.blocks.size} blocks stored, tip ${main.best.hash.slice(0, 16)}…`),
        h('div', {}, 'Difficulty'), h('div', {}, `${CFG.difficulty} bits (main) · ${CFG.commentDifficulty} bits (other people's blocks)`),
        h('div', {}, 'Chains loaded'), h('div', {}, String(chains.size)),
        h('div', {}, 'Peers'), h('div', {}, net.status()),
        h('div', {}, 'Videos hosted'), h('div', {}, `${hosting.size} (${fmtBytes([...hosting.values()].reduce((s, x) => s + x.size, 0))})`),
        h('div', {}, 'Trackers'), h('div', { class: 'mono' }, TRACKERS.join(' ')))));
} };

uiReady = true;
render(true);
window.addEventListener('beforeunload', (e) => { if (E.miner || hosting.size) { e.preventDefault(); e.returnValue = ''; } });
// Exposed for debugging in the console.
window.opentube = { me, engine: E, net, wt };

// ---------------------------------------------------------------- connect
if (params.get('net') === 'local') startLocal();
else {
  const url = params.get('net') === 'p2p' ? null : homeNodeUrl();
  if (!(url && await connectHome(url))) startP2P();
}

// ---------------------------------------------------------------- mirror mode
// ?mirror=<user ID> turns this page into that person's always-on host (e.g. headless Chromium on a
// server, see headless.mjs). It follows the person's signed membership list and joins exactly the
// channels they joined; when they leave a channel it leaves too and frees the space.
// ?cap=<GB> sets the storage limit per channel.
if (params.get('cap')) settings.hostCapGB = Math.max(1, Number(params.get('cap')) || settings.hostCapGB);
if (MIRROR) {
  let applied = 0;
  const apply = async () => {
    const m = E.memberships.get(MIRROR);
    if (!m || m.at === applied) return;
    applied = m.at;
    const want = new Set(m.joined);
    for (const id of want) if (subs[id] !== 'join' && (genesisFor(id) || E.directory.has(id))) setSub(id, 'join');
    for (const id of joinedList()) if (!want.has(id)) {
      setSub(id, null);
      // Free the space: drop the videos we were hosting for that channel.
      const ch = folder.channels.get(id);
      if (ch) { for (const ih of Object.keys(ch.meta.videos)) await removeVideo(id, ih); setTimeout(() => folder.root.removeEntry(ch.folderName, { recursive: true }).catch(() => {}), 1000); folder.channels.delete(id); }
    }
    console.log(`opentube-mirror following ${MIRROR.slice(0, 8)}… : ${want.size} channel(s) joined`);
  };
  const report = () => console.log('opentube-status ' + JSON.stringify({
    net: net.status(), height: main.best.height, mirror: MIRROR, found: E.memberships.has(MIRROR), channels: joinedList().length,
    hosting: hosting.size, hostedBytes: [...hosting.values()].reduce((s, x) => s + x.size, 0), downloading: fetching.size,
    peers: wt.torrents.reduce((n, t) => n + t.numPeers, 0), up: Math.round(wt.uploadSpeed), down: Math.round(wt.downloadSpeed)
  }));
  const tick = () => { E.requestMembership(MIRROR); apply(); };
  tick();
  setInterval(tick, 15000);
  setInterval(apply, 2000);
  setInterval(report, 30000);
  setTimeout(report, 3000);
} else if (joinedList().length || E.memberships.has(me.pub)) {
  publishMyMembership();   // make sure the network has my current list
}
</script>
</body>
</html>
