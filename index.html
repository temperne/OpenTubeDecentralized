<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenTube</title>
<meta name="description" content="A serverless video platform where every browser is a blockchain node and a video host.">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1f232c; --border: #2a2f3a;
    --text: #e8eaf0; --muted: #9aa3b2; --accent: #ff4d5e; --accent-2: #3ea6ff; --ok: #3ecf8e; --warn: #f5a524;
    --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7f9; --panel: #ffffff; --panel-2: #eef0f4; --border: #dde1e8; --text: #15181e; --muted: #5b6475; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { position: sticky; top: 0; z-index: 10; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .logo { font-weight: 800; font-size: 20px; letter-spacing: -0.5px; white-space: nowrap; color: var(--text); }
  .logo span { color: var(--accent); }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav a { padding: 6px 12px; border-radius: 8px; color: var(--text); }
  nav a.active { background: var(--panel-2); }
  .status { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 5px; vertical-align: middle; }
  .dot.on { background: var(--ok); } .dot.busy { background: var(--warn); }
  button { font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); padding: 7px 14px; border-radius: 8px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.on { border-color: var(--ok); color: var(--ok); }
  button.small { padding: 3px 9px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
  h1, h2, h3 { line-height: 1.25; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; color: var(--text); display: block; }
  .card:hover { text-decoration: none; border-color: var(--muted); }
  .thumb { aspect-ratio: 16/9; background: #000 center/cover no-repeat; display: grid; place-items: center; color: #666; font-size: 32px; }
  .card .meta { padding: 10px 12px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--muted); font-size: 13px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 18px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--panel-2) center/cover; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 22px; color: var(--muted); }
  .avatar.sm { width: 36px; height: 36px; font-size: 15px; }
  .chan-row { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 10px; color: var(--text); }
  .chan-row:hover { background: var(--panel-2); text-decoration: none; }
  .fp { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .badge.ok { color: var(--ok); border-color: var(--ok); } .badge.warn { color: var(--warn); border-color: var(--warn); }
  .watch { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; }
  @media (max-width: 900px) { .watch { grid-template-columns: 1fr; } }
  video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: var(--radius); display: block; }
  .bar { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; margin-top: 4px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 8px 0; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  input[type=text], input[type=search], input[type=number], textarea, select { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font: inherit; }
  textarea { min-height: 80px; resize: vertical; }
  .drop { border: 2px dashed var(--border); border-radius: var(--radius); padding: 24px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .item { border-top: 1px solid var(--border); padding: 10px 0; }
  .item:first-child { border-top: 0; }
  .item p, .pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; }
  .hidden-item { opacity: .45; }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin: 16px 0; }
  .tabs a { padding: 8px 14px; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs a.active { color: var(--text); border-color: var(--accent); }
  code, .mono { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 13px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--border); padding: 10px 18px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); z-index: 20; }
  #toast.show { opacity: 1; }
  .hidden { display: none !important; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 800px) { .split { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <a class="logo" href="#/">Open<span>Tube</span></a>
  <nav>
    <a href="#/" data-nav="home">Feed</a>
    <a href="#/explore" data-nav="explore">Explore</a>
    <a href="#/me" data-nav="me">My node</a>
  </nav>
  <div class="status">
    <span><span class="dot" id="dot-net"></span><span id="st-net">connecting…</span></span>
    <span><span class="dot" id="dot-chain"></span><span id="st-chain">main chain…</span></span>
    <span id="st-p2p"></span>
  </div>
</header>
<main id="app"><div class="empty">Starting node…</div></main>
<div id="toast"></div>
<!--
  ===================================================================== OPENTUBE CORE
  The blockchain rules. This script touches no DOM or browser storage, so
  server.mjs extracts this exact block from the HTML and runs it too. Browser
  nodes and server nodes enforce identical rules from one source.

  MAIN CHAIN    proof of work, kept by every node. Each block registers
                channels and lists by embedding their full signed genesis blocks.
  CHANNEL/LIST  one chain per channel or list, controlled by the owner's key.
  CHAINS        Blocks form a hash-linked DAG (several parents allowed) so
                approved commenters can append at the same time. Nothing is
                ever deleted: "hide" is a signed record that every node honours.
  ===================================================================== -->
<script id="opentube-core">
(() => {
// Changing anything in MAIN_GENESIS creates a different network: its hash is the network ID.
const MAIN_GENESIS = {
  v: 1, chain: null, parents: [], height: 0, ts: 1794960000000, author: null, nonce: 0,
  payload: {
    type: 'genesis', kind: 'main',
    name: 'OpenTube Main Chain',
    difficulty: 18,          // leading zero bits required on main-chain blocks
    commentDifficulty: 10,   // anti-spam work on blocks written by non-owners
    maxEntries: 16,          // registrations per main block
    trackers: [
      'wss://tracker.openwebtorrent.com',
      'wss://tracker.webtorrent.dev',
      'wss://tracker.btorrent.xyz',
      'wss://tracker.files.fm:7073/announce'
    ]
  }
};
const LIMITS = { blockBytes: 300000, name: 60, about: 2000, title: 140, text: 5000, comment: 1000, image: 60000, parents: 8, batchBytes: 4000000, orphans: 5000 };

// ---- primitives
const enc = new TextEncoder();
const hex = (buf) => Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
const sha256hex = async (s) => hex(await crypto.subtle.digest('SHA-256', enc.encode(s)));
// Canonical JSON: sorted keys, so every node hashes identical bytes.
const canon = (v) => v === null || typeof v !== 'object' ? JSON.stringify(v)
  : Array.isArray(v) ? '[' + v.map(canon).join(',') + ']'
  : '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
const zeroBits = (hexStr) => { let z = 0; for (const c of hexStr) { const n = parseInt(c, 16); if (n === 0) { z += 4; continue; } return z + Math.clz32(n) - 28; } return z; };
const isStr = (v, max) => typeof v === 'string' && v.length <= max;
const isImg = (v) => v === '' || (typeof v === 'string' && v.length <= LIMITS.image && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v));
const isHex = (v, len) => typeof v === 'string' && v.length === len && /^[0-9a-f]+$/.test(v);
const isKey = (v) => typeof v === 'string' && /^[A-Za-z0-9_-]{43}$/.test(v);
const b64u = {
  enc: (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
  dec: (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0))
};
const ED = { name: 'Ed25519' };
const pubKeys = new Map();
async function verify(pub, msg, sig) {
  try {
    let k = pubKeys.get(pub);
    if (!k) { k = await crypto.subtle.importKey('raw', b64u.dec(pub), ED, false, ['verify']); pubKeys.set(pub, k); }
    return await crypto.subtle.verify(ED, k, b64u.dec(sig), enc.encode(msg));
  } catch { return false; }
}
async function newIdentity() {
  const kp = await crypto.subtle.generateKey(ED, true, ['sign', 'verify']);
  return { pub: b64u.enc(await crypto.subtle.exportKey('raw', kp.publicKey)), priv: b64u.enc(await crypto.subtle.exportKey('pkcs8', kp.privateKey)) };
}
async function signer(identity) {
  const key = await crypto.subtle.importKey('pkcs8', b64u.dec(identity.priv), ED, false, ['sign']);
  return { pub: identity.pub, sign: async (msg) => b64u.enc(await crypto.subtle.sign(ED, key, enc.encode(msg))) };
}

// ---- blocks: hash = sha256(canon(block minus hash/sig/nonce) + ':' + nonce); sig = Ed25519(author, hash)
const preimage = (b) => { const { hash, sig, nonce, ...rest } = b; return canon(rest) + ':'; };
const hashBlock = (b) => sha256hex(preimage(b) + b.nonce);

class Chain {
  constructor(id, genesis) {
    this.id = id; this.genesis = genesis;
    this.blocks = new Map([[id, genesis]]);
    this.children = new Map();
    this.heads = new Set([id]);
    this.orphans = new Map();   // blocks waiting for their parents
    this.version = 0;           // bumps on every change; used to cache derived state
  }
  get owner() { return this.genesis.author; }
  has(hash) { return this.blocks.has(hash); }
  ancestors(hashes, into = new Set()) {
    const stack = [...hashes];
    while (stack.length) { const x = stack.pop(); if (into.has(x) || !this.blocks.has(x)) continue; into.add(x); stack.push(...this.blocks.get(x).parents); }
    return into;
  }
  add(b) {
    this.blocks.set(b.hash, b);
    for (const p of b.parents) { this.heads.delete(p); (this.children.get(p) || this.children.set(p, []).get(p)).push(b.hash); }
    if (!this.children.has(b.hash)) this.heads.add(b.hash);
    this.version++;
  }
  // Blocks a peer is missing: ancestors of `want` minus ancestors of the peer's `have`.
  missingFor(want, have) {
    const exclude = this.ancestors(have.filter(x => this.blocks.has(x)));
    const out = [...this.ancestors(want.filter(x => this.blocks.has(x)))].filter(x => !exclude.has(x) && x !== this.id).map(x => this.blocks.get(x));
    out.sort((a, b) => a.height - b.height || a.ts - b.ts);
    const res = []; let bytes = 0;
    for (const b of out) { bytes += canon(b).length; if (bytes > LIMITS.batchBytes) break; res.push(b); }
    return res;
  }
}

function validGenesis(g) {
  if (!g || g.v !== 1 || g.chain !== null || !Array.isArray(g.parents) || g.parents.length || g.height !== 0 || !isKey(g.author)) return false;
  const p = g.payload;
  if (!p || p.type !== 'genesis' || !['channel', 'list'].includes(p.kind)) return false;
  if (!isStr(p.name, LIMITS.name) || !p.name.trim() || !isStr(p.about, LIMITS.about)) return false;
  if (p.kind === 'channel' && (!isImg(p.avatar) || !['anyone', 'approved', 'off'].includes(p.comments))) return false;
  return true;
}
async function checkSigned(b) {
  if (!b || typeof b !== 'object' || !isHex(b.hash, 64) || typeof b.sig !== 'string' || !Number.isSafeInteger(b.nonce) || !Number.isSafeInteger(b.ts) || !Number.isSafeInteger(b.height)) return false;
  if (canon(b).length > LIMITS.blockBytes) return false;
  if (b.ts > Date.now() + 10 * 60000) return false;
  if (await hashBlock(b) !== b.hash) return false;
  return verify(b.author, b.hash, b.sig);
}
function validPayload(chain, b, CFG) {
  const p = b.payload; if (!p || typeof p !== 'object') return false;
  const owner = b.author === chain.owner;
  const kind = chain.genesis.payload.kind;
  if (!owner) {
    if (kind !== 'channel' || zeroBits(b.hash) < CFG.commentDifficulty) return false;
    if (p.type === 'comment') return isHex(p.target, 64) && isStr(p.text, LIMITS.comment) && p.text.trim().length > 0 && isStr(p.name ?? '', LIMITS.name);
    if (p.type === 'hide') return isHex(p.target, 64);
    return false;
  }
  switch (p.type) {
    case 'video': return kind === 'channel' && isStr(p.title, LIMITS.title) && isStr(p.desc, LIMITS.text) && isHex(p.infohash, 40) && isStr(p.file, 200) && Number.isSafeInteger(p.size) && isImg(p.thumb) && (p.comments === undefined || ['anyone', 'approved', 'off'].includes(p.comments));
    case 'settings': return kind === 'channel' && isHex(p.target, 64) && ['default', 'anyone', 'approved', 'off'].includes(p.comments);
    case 'post': return isStr(p.text, LIMITS.text) && p.text.trim().length > 0;
    case 'comment': return isHex(p.target, 64) && isStr(p.text, LIMITS.comment) && p.text.trim().length > 0;
    case 'hide': return isHex(p.target, 64);
    case 'allow': case 'revoke': return isKey(p.key);
    case 'profile': return (p.name === undefined || (isStr(p.name, LIMITS.name) && p.name.trim().length > 0)) && (p.about === undefined || isStr(p.about, LIMITS.about)) && (p.avatar === undefined || isImg(p.avatar)) && (p.comments === undefined || ['anyone', 'approved', 'off'].includes(p.comments));
    case 'add': return kind === 'list' && isHex(p.target, 64) && isStr(p.note ?? '', LIMITS.about);
    default: return false;
  }
}

// What a channel/list looks like after applying every rule (permissions, hides, profile edits).
function derive(c) {
  if (c._derived && c._derived.version === c.version) return c._derived;
  const owner = c.owner;
  const blocks = [...c.blocks.values()].filter(b => b.hash !== c.id).sort((a, b) => a.height - b.height || a.ts - b.ts || (a.hash < b.hash ? -1 : 1));
  const profile = { ...c.genesis.payload };
  const allowed = new Set(), revokes = [];
  const videoPolicy = new Map();  // video block hash -> comment policy overriding the channel default
  for (const b of blocks) if (b.author === owner) {
    const p = b.payload;
    if (p.type === 'video' && p.comments) videoPolicy.set(b.hash, p.comments);
    if (p.type === 'settings') { if (p.comments === 'default') videoPolicy.delete(p.target); else videoPolicy.set(p.target, p.comments); }
    if (p.type === 'profile') for (const k of ['name', 'about', 'avatar', 'comments']) if (p[k] !== undefined) profile[k] = p[k];
    if (p.type === 'allow') allowed.add(p.key);
    if (p.type === 'revoke') { allowed.delete(p.key); revokes.push({ key: p.key, before: c.ancestors([b.hash]) }); }
  }
  // A revoke hides everything that user writes except what the owner had already seen when revoking.
  const policyFor = (target) => videoPolicy.get(target) ?? profile.comments;
  const allows = (key, target) => {
    const pol = policyFor(target);
    return pol === 'anyone' || (pol === 'approved' && allowed.has(key));
  };
  const permitted = (b) => {
    if (b.author === owner) return true;
    if (revokes.some(r => r.key === b.author && !r.before.has(b.hash))) return false;
    if (b.payload.type === 'hide') return true;  // people may hide their own comments
    return allows(b.author, b.payload.target);
  };
  const visible = blocks.filter(permitted);
  const hidden = new Set();
  for (const b of visible) if (b.payload.type === 'hide') {
    const t = c.blocks.get(b.payload.target);
    if (t && (b.author === owner || t.author === b.author)) hidden.add(t.hash);
  }
  const live = visible.filter(b => !hidden.has(b.hash));
  return (c._derived = {
    version: c.version, id: c.id, kind: c.genesis.payload.kind, owner, profile, allowed, revoked: new Set(revokes.map(r => r.key)), hidden,
    videos: live.filter(b => b.payload.type === 'video' && b.author === owner).reverse(),
    posts: live.filter(b => b.payload.type === 'post' && b.author === owner).reverse(),
    adds: live.filter(b => b.payload.type === 'add' && b.author === owner).reverse(),
    commentsFor: (target) => visible.filter(b => b.payload.type === 'comment' && b.payload.target === target),
    policyFor, videoPolicy,
    canComment: (key, target) => key === owner || (!revokes.some(r => r.key === key) && allows(key, target)),
    blockCount: c.blocks.size
  });
}

/* ---- the node engine. Host environments plug in:
     send(msg, peer?)          deliver a protocol message (no peer = everyone)
     signer {pub, sign}        this node's identity
     keyFor(pub)               signer for a channel key this node holds, or null
     mine(body, bits, onProg)  -> {promise<nonce>, cancel}
     shouldMine(genesis)       which pending registrations this node spends work on
     persist(chainId, block)   store a newly accepted block
     onBlock(chain, block)     after a block is accepted
     onChange()                something changed (UI refresh)
     trackAll                  keep every registered chain (server nodes)
   Protocol: heads {c,h} | rq {c,w,h} (empty w = "send me your heads") | bk {c,b} | mp {e} */
async function createEngine(o) {
  const send = (m, to) => { try { o.send?.(m, to); } catch (e) { console.warn('send', e); } };
  const changed = () => o.onChange?.();
  const MAIN_ID = await hashBlock(MAIN_GENESIS);
  const CFG = MAIN_GENESIS.payload;
  const main = new Chain(MAIN_ID, { ...MAIN_GENESIS, hash: MAIN_ID });
  main.best = main.genesis;
  const chains = new Map([[MAIN_ID, main]]);
  const mempool = new Map();  // genesis hash -> genesis block awaiting registration
  const E = { MAIN_ID, CFG, main, chains, mempool, directory: new Map(), miner: null, minedHashes: 0 };

  const headsOf = (c) => c === main ? [main.best.hash] : [...c.heads];
  const genesisFor = (id) => chains.get(id)?.genesis || E.directory.get(id)?.genesis || mempool.get(id) || null;
  const announce = (c, to) => send({ t: 'heads', c: c.id, h: headsOf(c) }, to);
  const requestChain = (c, to) => send({ t: 'rq', c: c.id, w: [], h: headsOf(c) }, to);
  function openChain(id) {
    if (chains.has(id)) return chains.get(id);
    const g = genesisFor(id); if (!g) return null;
    const c = new Chain(id, g); chains.set(id, c);
    return c;
  }

  // ---- main chain: proof of work; the highest chain wins (ties: lowest tip hash)
  async function validMainBlock(b) {
    if (b.parents.length !== 1 || zeroBits(b.hash) < CFG.difficulty) return false;
    const p = b.payload;
    if (!p || p.type !== 'register' || !Array.isArray(p.entries) || !p.entries.length || p.entries.length > CFG.maxEntries) return false;
    for (const g of p.entries) if (!validGenesis(g) || !(await checkSigned(g))) return false;
    return true;
  }
  function rebuildDirectory() {
    const path = [];
    for (let b = main.best; b && b.hash !== MAIN_ID; b = main.blocks.get(b.parents[0])) path.push(b);
    const d = new Map();
    for (const b of path.reverse()) for (const g of b.payload.entries) if (!d.has(g.hash)) d.set(g.hash, { genesis: g, height: b.height, ts: b.ts });
    E.directory = d;
    // Registrations knocked out by a reorg go back to the mempool.
    for (const blk of main.blocks.values()) for (const g of blk.payload?.entries || []) if (!d.has(g.hash)) mempool.set(g.hash, g);
    for (const id of d.keys()) mempool.delete(id);
    if (o.trackAll) for (const id of d.keys()) if (!chains.has(id)) requestChain(openChain(id));
  }
  function onMainBlock(b) {
    const best = main.best;
    if (b.height > best.height || (b.height === best.height && b.hash < best.hash)) {
      main.best = b;
      rebuildDirectory();
      if (E.miner && E.miner.tip !== main.best.hash) { E.miner.job.cancel(); E.miner = null; }
      maybeMine();
    }
  }
  function maybeMine() {
    if (E.miner || !o.mine) return;
    const pending = [...mempool.values()].filter(g => !E.directory.has(g.hash));
    const shouldMine = o.shouldMine || ((g) => g.author === o.signer.pub || !!o.keyFor?.(g.author));
    if (!pending.some(shouldMine)) return;
    const entries = pending.sort((a, b) => shouldMine(b) - shouldMine(a)).slice(0, CFG.maxEntries);
    const tip = main.best;
    const body = { v: 1, chain: MAIN_ID, parents: [tip.hash], height: tip.height + 1, ts: Date.now(), author: o.signer.pub, payload: { type: 'register', entries }, nonce: 0 };
    E.minedHashes = 0;

views.me = { render() {
  const owned = [...new Set([...E.directory.keys(), ...mempool.keys(), ...chains.keys()])].filter(id => id !== MAIN_ID && isMine(genesisFor(id)?.author));
  const kind = h('select', {}, h('option', { value: 'channel' }, 'Channel'), h('option', { value: 'list' }, 'List (curated channels)'));
  const name = h('input', { type: 'text', maxLength: LIMITS.name, placeholder: 'Name' });
  const about = h('textarea', { maxLength: LIMITS.about, placeholder: 'What is it about?' });
  const policy = h('select', {}, [['anyone', 'Anyone can comment'], ['approved', 'Only approved users'], ['off', 'Comments off']].map(([v, l]) => h('option', { value: v }, l)));
  const avatarIn = h('input', { type: 'file', accept: 'image/*' });
  const chanOnly = h('div', {}, h('label', {}, 'Avatar'), avatarIn, h('label', {}, 'Comments'), policy);
  kind.onchange = () => chanOnly.classList.toggle('hidden', kind.value !== 'channel');
  const create = h('button', { class: 'primary' }, 'Create & register');
  create.onclick = async () => {
    if (!name.value.trim()) return toast('Give it a name');
    create.disabled = true;
    const payload = { type: 'genesis', kind: kind.value, name: name.value.trim(), about: about.value.trim() };
    if (kind.value === 'channel') { payload.avatar = avatarIn.files[0] ? await imageFileToDataUrl(avatarIn.files[0]) : ''; payload.comments = policy.value; }
    let g;
    try {
      const key = await newIdentity();           // a fresh key pair just for this channel/list
      await addChannelKey({ ...key, name: payload.name });
      g = await E.createGenesis(payload, ownedSigners.get(key.pub));
      await addChannelKey({ ...key, chain: g.hash });
    } catch (e) { create.disabled = false; return toast(e.message); }
    kv.set('pending', [...mempool.values()].filter(x => isMine(x.author)));
    toast('Created with its own key. Export the key from the channel page to back it up.');
    location.hash = `#/c/${g.hash}`;
  };
  const nameIn = h('input', { type: 'text', value: settings.name, maxLength: LIMITS.name });
  const cap = h('input', { type: 'number', min: 1, max: 1000, value: settings.hostCapGB });
  const importIn = h('input', { type: 'file', accept: 'application/json', class: 'hidden' });
  const chanImport = h('input', { type: 'file', accept: 'application/json', class: 'hidden' });
  chanImport.onchange = async () => {
    try {
      const k = JSON.parse(await chanImport.files[0].text());
      if (!(await checkKeyPair(k))) throw new Error('bad');
      await addChannelKey({ pub: k.pub, priv: k.priv, chain: isHex(k.chain, 64) ? k.chain : undefined, name: typeof k.name === 'string' ? k.name.slice(0, 60) : '', exported: true });
      const id = isHex(k.chain, 64) ? k.chain : [...E.directory.keys()].find(x => genesisFor(x).author === k.pub);
      toast('Key imported. You now control this ' + (k.kind || 'channel') + ' from this browser.');
      if (id && openChain(id)) { E.requestChain(chains.get(id)); location.hash = `#/c/${id}`; } else scheduleRender();
    } catch { toast('That is not a valid OpenTube channel key file'); }
    chanImport.value = '';
  };
  importIn.onchange = async () => {
    try {
      const k = JSON.parse(await importIn.files[0].text());
      if (!(await checkKeyPair(k))) throw new Error('bad file');
      if (k.kind === 'channel' || k.kind === 'list') return toast('That is a channel key: use “Import channel key” instead');
      if (!confirm('Replace this browser’s identity with the imported key? Channels owned by the current key will no longer be editable here unless you export it first.')) return;
      await kv.set('identity', { pub: k.pub, priv: k.priv }); location.reload();
    } catch { toast('That is not a valid OpenTube key file'); }
  };
  return h('div', {},
    h('h2', { style: 'margin-top:0' }, 'My node'),
    h('div', { class: 'split' },
      h('div', { class: 'panel' }, h('h3', { style: 'margin-top:0' }, 'Identity'),
        h('p', { class: 'sub' }, 'Your personal key identifies you when you comment on other channels. Channels and lists you create each get their own key; export those from each channel’s Manage tab.'),
        h('div', { class: 'mono', style: 'padding:8px;background:var(--panel-2);border-radius:6px' }, me.pub),
        h('div', { class: 'row', style: 'margin-top:10px' },
          h('button', { onclick: () => navigator.clipboard?.writeText(me.pub).then(() => toast('Key copied')) }, 'Copy public key'),
          h('button', { onclick: () => download(`opentube-personal-key-${fp(me.pub)}.json`, { format: 'opentube-key', kind: 'personal', pub: identity.pub, priv: identity.priv }) }, 'Back up personal key'),
          h('button', { onclick: () => importIn.click() }, 'Restore personal key'), importIn),
        h('label', {}, 'Display name for comments'), nameIn,
        h('label', {}, 'Storage limit per joined channel (GB)'), cap,
        h('button', { style: 'margin-top:10px', onclick: () => { settings.name = nameIn.value.trim().slice(0, LIMITS.name) || settings.name; settings.hostCapGB = Math.max(1, Number(cap.value) || 5); saveSettings(); toast('Saved'); } }, 'Save')),
      h('div', { class: 'panel' }, h('h3', { style: 'margin-top:0' }, 'Create a channel or list'),
        h('p', { class: 'sub' }, `This creates a new key pair and a new chain whose genesis block it signs. The whole genesis block is embedded in a main-chain block, which your browser mines (proof of work, ${CFG.difficulty} bits). That usually takes seconds to a minute.`),
        h('label', {}, 'Type'), kind, h('label', {}, 'Name'), name, h('label', {}, 'About'), about, chanOnly,
        h('div', { style: 'margin-top:12px' }, create))),
    h('div', { class: 'panel' }, h('div', { class: 'row', style: 'justify-content:space-between' }, h('h3', { style: 'margin:0' }, 'Your channels & lists'),
        h('button', { onclick: () => chanImport.click() }, 'Import channel key'), chanImport),
      owned.length ? owned.map(id => h('div', { class: 'row' }, h('div', { style: 'flex:1' }, chanRow(id)),
        channelKeys[genesisFor(id).author] ? h('button', { class: 'small', onclick: () => exportChannelKey(id) }, channelKeys[genesisFor(id).author].exported ? 'Export key again' : 'Export key ⚠') : null))
        : h('div', { class: 'sub' }, 'None yet.')),
    h('div', { class: 'panel' }, h('h3', { style: 'margin-top:0' }, 'Subscriptions'), Object.keys(subs).length ? Object.keys(subs).map(chanRow) : h('div', { class: 'sub' }, 'None yet.')),
    h('div', { class: 'panel' }, h('h3', { style: 'margin-top:0' }, 'Node'),
      h('div', { class: 'kv' },
        h('div', {}, 'Network ID'), h('div', { class: 'mono' }, MAIN_ID),
        h('div', {}, 'Main chain'), h('div', {}, `height ${main.best.height}, ${main.blocks.size} blocks stored, tip ${main.best.hash.slice(0, 16)}…`),
        h('div', {}, 'Difficulty'), h('div', {}, `${CFG.difficulty} bits (main) · ${CFG.commentDifficulty} bits (other people's blocks)`),
        h('div', {}, 'Chains loaded'), h('div', {}, String(chains.size)),
        h('div', {}, 'Peers'), h('div', {}, net.status()),
        h('div', {}, 'Videos hosted'), h('div', {}, `${hosting.size} (${fmtBytes([...hosting.values()].reduce((s, x) => s + x.size, 0))})`),
        h('div', {}, 'Trackers'), h('div', { class: 'mono' }, TRACKERS.join(' ')))));
} };

uiReady = true;
render(true);
window.addEventListener('beforeunload', (e) => { if (E.miner || hosting.size) { e.preventDefault(); e.returnValue = ''; } });
// Exposed for debugging in the console.
window.opentube = { me, engine: E, net, wt };

// ---------------------------------------------------------------- connect
if (params.get('net') === 'local') startLocal();
else {
  const url = params.get('net') === 'p2p' ? null : homeNodeUrl();
  if (!(url && await connectHome(url))) startP2P();
}
</script>
</body>
</html>
