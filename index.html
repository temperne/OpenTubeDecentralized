<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenTube</title>
<meta name="description" content="A serverless video platform where every browser is a blockchain node and a video host.">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1f232c; --border: #2a2f3a;
    --text: #e8eaf0; --muted: #9aa3b2; --accent: #ff4d5e; --accent-2: #3ea6ff; --ok: #3ecf8e; --warn: #f5a524;
    --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7f9; --panel: #ffffff; --panel-2: #eef0f4; --border: #dde1e8; --text: #15181e; --muted: #5b6475; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { position: sticky; top: 0; z-index: 10; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .logo { font-weight: 800; font-size: 20px; letter-spacing: -0.5px; white-space: nowrap; color: var(--text); }
  .logo span { color: var(--accent); }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav a { padding: 6px 12px; border-radius: 8px; color: var(--text); }
  nav a.active { background: var(--panel-2); }
  .actions { display: flex; gap: 6px; }
  .act { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); color: var(--text); font-weight: 600; text-decoration: none; white-space: nowrap; }
  .act:hover { background: var(--panel-2); text-decoration: none; }
  .act.live, .act.live:hover { color: #fff; background: #e5293b; border-color: #e5293b; }
  .act.live:hover { filter: brightness(1.08); }
  .quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .status { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 5px; vertical-align: middle; }
  .dot.on { background: var(--ok); } .dot.busy { background: var(--warn); } .dot.bad { background: var(--accent); }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.ok { background: rgba(62,207,142,.15); color: var(--ok); } .pill.warn { background: rgba(245,165,36,.15); color: var(--warn); } .pill.error { background: rgba(255,77,94,.15); color: var(--accent); }
  .check { display: grid; grid-template-columns: 110px 1fr; gap: 4px 14px; padding: 10px 0; border-top: 1px solid var(--border); }
  .check:first-child { border-top: 0; }
  .check .fix { color: var(--muted); font-size: 13px; }
  table.diag { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.diag th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  table.diag td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .tablewrap { overflow-x: auto; }
  .log { font-family: ui-monospace, monospace; font-size: 12px; max-height: 320px; overflow: auto; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); padding: 7px 14px; border-radius: 8px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.on { border-color: var(--ok); color: var(--ok); }
  button.small { padding: 3px 9px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
  h1, h2, h3 { line-height: 1.25; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; color: var(--text); display: block; }
  .card:hover { text-decoration: none; border-color: var(--muted); }
  .thumb { aspect-ratio: 16/9; background: #000 center/cover no-repeat; display: grid; place-items: center; color: #666; font-size: 32px; }
  .card .meta { padding: 10px 12px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--muted); font-size: 13px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 18px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--panel-2) center/cover; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 22px; color: var(--muted); }
  .avatar.sm { width: 36px; height: 36px; font-size: 15px; }
  .chan-row { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 10px; color: var(--text); }
  .chan-row:hover { background: var(--panel-2); text-decoration: none; }
  .fp { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .badge.ok { color: var(--ok); border-color: var(--ok); } .badge.warn { color: var(--warn); border-color: var(--warn); }
  .watch { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; }
  @media (max-width: 900px) { .watch { grid-template-columns: 1fr; } }
  video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: var(--radius); display: block; }
  .bar { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; margin-top: 4px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 8px 0; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  input[type=text], input[type=search], input[type=number], textarea, select { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font: inherit; }
  textarea { min-height: 80px; resize: vertical; }
  .drop { border: 2px dashed var(--border); border-radius: var(--radius); padding: 24px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .item { border-top: 1px solid var(--border); padding: 10px 0; }
  .item:first-child { border-top: 0; }
  .item p, .pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; }
  .hidden-item { opacity: .45; }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin: 16px 0; }
  .tabs a { padding: 8px 14px; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs a.active { color: var(--text); border-color: var(--accent); }
  code, .mono { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 13px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--border); padding: 10px 18px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); z-index: 20; }
  #toast.show { opacity: 1; }
  .hidden { display: none !important; }
  .ccard { padding: 16px; text-align: center; }
  .ccard .avatar { margin: 0 auto 10px; width: 72px; height: 72px; font-size: 28px; }
  .ccard p { margin: 6px 0 0; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar input[type=search] { flex: 1 1 260px; width: auto; }
  .toolbar select { width: auto; }
  .votes { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .votes button { border: 0; border-radius: 0; background: var(--panel-2); padding: 6px 14px; }
  .votes button + button { border-left: 1px solid var(--border); }
  .votes button.mine { color: var(--accent-2); font-weight: 700; }
  .rank-n { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.7); color: #fff; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 6px; }
  .thumb { position: relative; }
  .bal { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  .meter { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin: 6px 0; }
  .meter > div { height: 100%; background: var(--ok); }
  .tx { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .tx:first-child { border-top: 0; }
  .amt-in { color: var(--ok); font-weight: 700; } .amt-out { color: var(--accent); font-weight: 700; }
  .badge.live { background: #e5293b; color: #fff; border-color: #e5293b; font-weight: 700; }
  .live-banner { display: block; text-decoration: none; color: inherit; margin: 0 0 12px; border-color: #e5293b; }
  #folderbar { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 10px 16px; background: var(--panel-2); border-bottom: 1px solid var(--warn); font-size: 14px; }
  #folderbar.hidden { display: none; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 800px) { .split { grid-template-columns: 1fr; } }
</style>
</head>

<header>
  <a class="logo" href="#/">Open<span>Tube</span></a>
  <nav>
    <a href="#/" data-nav="home">Feed</a>

    <a href="#/wallet" data-nav="wallet">Wallet</a>
    <a href="#/mine" data-nav="mine" id="nav-mine">My channel</a>

    <span><span class="dot" id="dot-health"></span><span id="st-health">checking…</span></span>
    <span><span class="dot" id="dot-net"></span><span id="st-net">connecting…</span></span>

<main id="app"><div class="empty">Starting node…</div></main>

<!--
  ===================================================================== OPENTUBE CORE
  The blockchain rules. This script touches no DOM or browser storage, so
  server.mjs extracts this exact block from the HTML and runs it too. Browser
  nodes and server nodes enforce identical rules from one source.

  MAIN CHAIN    proof of work, kept by every node. Each block registers
                channels and lists by embedding their full signed genesis blocks.
  CHANNEL/LIST  one chain per channel or list, controlled by the owner's key.
  CHAINS        Blocks form a hash-linked DAG (several parents allowed) so
                approved commenters can append at the same time. Nothing is
                ever deleted: "hide" is a signed record that every node honours.
  ===================================================================== -->
<script id="opentube-core">
(() => {
// Changing anything in MAIN_GENESIS creates a different network: its hash is the network ID.
const MAIN_GENESIS = {
  v: 1, chain: null, parents: [], height: 0, ts: 1794960000000, author: null, nonce: 0,
  payload: {
    type: 'genesis', kind: 'main',
    name: 'OpenTube Main Chain',
    difficulty: 18,          // leading zero bits required on main-chain blocks
    commentDifficulty: 10,   // anti-spam work on blocks written by non-owners
    maxEntries: 16,          // registrations per main block
    trackers: [
      'wss://tracker.openwebtorrent.com',
      'wss://tracker.webtorrent.dev',
      'wss://tracker.btorrent.xyz',
      'wss://tracker.files.fm:7073/announce'
    ]
  }
};
const LIMITS = { blockBytes: 300000, name: 60, about: 2000, title: 140, text: 5000, comment: 1000, image: 60000, parents: 8, batchBytes: 4000000, orphans: 5000 };

// ---- primitives
const enc = new TextEncoder();
const hex = (buf) => Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
const sha256hex = async (s) => hex(await crypto.subtle.digest('SHA-256', enc.encode(s)));
// Canonical JSON: sorted keys, so every node hashes identical bytes.
const canon = (v) => v === null || typeof v !== 'object' ? JSON.stringify(v)
  : Array.isArray(v) ? '[' + v.map(canon).join(',') + ']'
  : '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
const zeroBits = (hexStr) => { let z = 0; for (const c of hexStr) { const n = parseInt(c, 16); if (n === 0) { z += 4; continue; } return z + Math.clz32(n) - 28; } return z; };
const isStr = (v, max) => typeof v === 'string' && v.length <= max;
const isImg = (v) => v === '' || (typeof v === 'string' && v.length <= LIMITS.image && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v));
const isHex = (v, len) => typeof v === 'string' && v.length === len && /^[0-9a-f]+$/.test(v);
const isKey = (v) => typeof v === 'string' && /^[A-Za-z0-9_-]{43}$/.test(v);
const b64u = {
  enc: (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
  dec: (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0))
};
const ED = { name: 'Ed25519' };
const pubKeys = new Map();
async function verify(pub, msg, sig) {
  try {
    let k = pubKeys.get(pub);
    if (!k) { k = await crypto.subtle.importKey('raw', b64u.dec(pub), ED, false, ['verify']); pubKeys.set(pub, k); }
    return await crypto.subtle.verify(ED, k, b64u.dec(sig), enc.encode(msg));
  } catch { return false; }
}
async function newIdentity() {
  const kp = await crypto.subtle.generateKey(ED, true, ['sign', 'verify']);
  return { pub: b64u.enc(await crypto.subtle.exportKey('raw', kp.publicKey)), priv: b64u.enc(await crypto.subtle.exportKey('pkcs8', kp.privateKey)) };
}
async function signer(identity) {
  const key = await crypto.subtle.importKey('pkcs8', b64u.dec(identity.priv), ED, false, ['sign']);
  return { pub: identity.pub, sign: async (msg) => b64u.enc(await crypto.subtle.sign(ED, key, enc.encode(msg))) };
}

// ---- blocks: hash = sha256(canon(block minus hash/sig/nonce) + ':' + nonce); sig = Ed25519(author, hash)
const preimage = (b) => { const { hash, sig, nonce, ...rest } = b; return canon(rest) + ':'; };
const hashBlock = (b) => sha256hex(preimage(b) + b.nonce);

class Chain {
  constructor(id, genesis) {
    this.id = id; this.genesis = genesis;
    this.blocks = new Map([[id, genesis]]);
    this.children = new Map();
    this.heads = new Set([id]);
    this.orphans = new Map();   // blocks waiting for their parents
    this.version = 0;           // bumps on every change; used to cache derived state
    // Diagnostics: what we've heard about this chain from peers and how syncing is going.
    this.stats = { announces: 0, lastAnnounce: 0, lastBlock: 0, lastRequest: 0, lastResponse: 0, unknownHeads: [], accepted: 0, rejected: 0, lastReject: '' };
  }
  get owner() { return this.genesis.author; }
  has(hash) { return this.blocks.has(hash); }
  ancestors(hashes, into = new Set()) {
    const stack = [...hashes];
    while (stack.length) { const x = stack.pop(); if (into.has(x) || !this.blocks.has(x)) continue; into.add(x); stack.push(...this.blocks.get(x).parents); }
    return into;
  }
  add(b) {
    this.blocks.set(b.hash, b);
    for (const p of b.parents) { this.heads.delete(p); (this.children.get(p) || this.children.set(p, []).get(p)).push(b.hash); }
    if (!this.children.has(b.hash)) this.heads.add(b.hash);
    this.version++;
  }
  // Blocks a peer is missing: ancestors of `want` minus ancestors of the peer's `have`.
  missingFor(want, have) {
    const exclude = this.ancestors(have.filter(x => this.blocks.has(x)));
    const out = [...this.ancestors(want.filter(x => this.blocks.has(x)))].filter(x => !exclude.has(x) && x !== this.id).map(x => this.blocks.get(x));
    out.sort((a, b) => a.height - b.height || a.ts - b.ts);
    const res = []; let bytes = 0;
    for (const b of out) { bytes += canon(b).length; if (bytes > LIMITS.batchBytes) break; res.push(b); }
    return res;
  }
}

function validGenesis(g) {
  if (!g || g.v !== 1 || g.chain !== null || !Array.isArray(g.parents) || g.parents.length || g.height !== 0 || !isKey(g.author)) return false;
  const p = g.payload;
  if (!p || p.type !== 'genesis' || !['channel', 'list'].includes(p.kind)) return false;
  if (!isStr(p.name, LIMITS.name) || !p.name.trim() || !isStr(p.about, LIMITS.about)) return false;
  if (p.kind === 'channel' && (!isImg(p.avatar) || !['anyone', 'approved', 'off'].includes(p.comments))) return false;
  if (p.kind === 'list' && p.ranking !== undefined && p.ranking !== true) return false;
  return true;
}
async function checkSigned(b) {
  if (!b || typeof b !== 'object' || !isHex(b.hash, 64) || typeof b.sig !== 'string' || !Number.isSafeInteger(b.nonce) || !Number.isSafeInteger(b.ts) || !Number.isSafeInteger(b.height)) return false;
  if (canon(b).length > LIMITS.blockBytes) return false;
  if (b.ts > Date.now() + 10 * 60000) return false;
  if (await hashBlock(b) !== b.hash) return false;
  return verify(b.author, b.hash, b.sig);
}
function validPayload(chain, b, CFG) {
  const p = b.payload; if (!p || typeof p !== 'object') return false;
  const owner = b.author === chain.owner;
  const kind = chain.genesis.payload.kind;
  if (!owner) {
    if (kind !== 'channel' || zeroBits(b.hash) < CFG.commentDifficulty) return false;
    if (p.type === 'comment') return isHex(p.target, 64) && isStr(p.text, LIMITS.comment) && p.text.trim().length > 0 && isStr(p.name ?? '', LIMITS.name) && permittedAt(chain, b);
    if (p.type === 'hide') return isHex(p.target, 64) && permittedAt(chain, b);
    if (p.type === 'vote') return isHex(p.target, 64) && [1, 0, -1].includes(p.v) && permittedAt(chain, b);
    return false;
  }
  switch (p.type) {
    case 'video': return kind === 'channel' && isStr(p.title, LIMITS.title) && isStr(p.desc, LIMITS.text) && isHex(p.infohash, 40) && isStr(p.file, 200) && Number.isSafeInteger(p.size) && isImg(p.thumb) && (p.comments === undefined || ['anyone', 'approved', 'off'].includes(p.comments))
      && (p.stream === undefined || isHex(p.stream, 64));   // the recording of a live stream
    // A live stream starts. Its media goes through the live hub (see createLiveHub), signed by this key or by `relay`
    // (a home node the owner lets sign for this stream, e.g. for OBS ingest). Chat is comments on this block.
    case 'live': return kind === 'channel' && isStr(p.title, LIMITS.title) && p.title.trim().length > 0 && isHex(p.stream, 64) && isStr(p.mime, 80) && (p.relay === undefined || isKey(p.relay));
    case 'liveend': return kind === 'channel' && isHex(p.stream, 64) && ['published', 'discarded', 'ended'].includes(p.outcome);
    case 'settings': return kind === 'channel' && isHex(p.target, 64) && ['default', 'anyone', 'approved', 'off'].includes(p.comments);
    case 'post': return isStr(p.text, LIMITS.text) && p.text.trim().length > 0;
    case 'comment': return isHex(p.target, 64) && isStr(p.text, LIMITS.comment) && p.text.trim().length > 0;
    case 'hide': return isHex(p.target, 64);
    case 'allow': case 'revoke': return isKey(p.key);
    case 'profile': return (p.name === undefined || (isStr(p.name, LIMITS.name) && p.name.trim().length > 0)) && (p.about === undefined || isStr(p.about, LIMITS.about)) && (p.avatar === undefined || isImg(p.avatar)) && (p.comments === undefined || ['anyone', 'approved', 'off'].includes(p.comments));
    case 'add': return kind === 'list' && isHex(p.target, 64) && isStr(p.note ?? '', LIMITS.about);
    case 'vote': return kind === 'channel' && isHex(p.target, 64) && [1, 0, -1].includes(p.v);
    // An ad. Its terms (price per view, max views…) are signed separately by the same key so a viewer's
    // claim can carry them to the main chain without the whole block.
    case 'ad': return kind === 'channel' && isStr(p.title, LIMITS.title) && isStr(p.file, 200) && isImg(p.thumb)
      && isStr(p.url, 300) && (p.url === '' || /^https:\/\/[^\s]+$/.test(p.url)) && termsShape(p.terms) && p.terms.advertiser === b.author && p.terms.channel === chain.id;
    // Run this advertiser's ads on this channel (or, for a list, on every channel in the list).
    case 'sponsor': return isHex(p.advertiser, 64);
    default: return false;
  }
}

// One vote per key per video: the latest one (by height, then time) counts.
function tallyVotes(blocks) {
  const latest = new Map();  // video -> Map(author -> block)
  for (const b of blocks) if (b.payload.type === 'vote') {
    const m = latest.get(b.payload.target) || latest.set(b.payload.target, new Map()).get(b.payload.target);
    const prev = m.get(b.author);
    if (!prev || b.height > prev.height || (b.height === prev.height && b.ts > prev.ts)) m.set(b.author, b);
  }
  const out = new Map();
  for (const [video, m] of latest) {
    let up = 0, down = 0; const by = new Map(), recent = [], blocks = [];
    for (const [author, b] of m) { if (b.payload.v > 0) up++; else if (b.payload.v < 0) down++; by.set(author, b.payload.v); if (b.payload.v) { recent.push([b.ts, b.payload.v]); blocks.push(b); } }

  function leave(sid, ih) {
    const s = sockets.get(sid), pid = s?.joined.get(ih);
    if (pid === undefined) return;
    const sw = swarms.get(ih); if (sw?.get(pid) === sid) sw.delete(pid);
    if (sw && !sw.size) swarms.delete(ih);
    s.joined.delete(ih);
  }
  return {
    attach(sid, send) { sockets.set(sid, { send, joined: new Map() }); },
    detach(sid) { const s = sockets.get(sid); if (!s) return; for (const ih of [...s.joined.keys()]) leave(sid, ih); sockets.delete(sid); },
    stats() { return { swarms: swarms.size, peers: sockets.size }; },
    message(sid, m) {
      const s = sockets.get(sid);
      if (!s || !m || typeof m !== 'object') return;
      if (m.action === 'scrape') {
        const files = {};
        for (const ih of [].concat(m.info_hash || []).slice(0, 50)) if (typeof ih === 'string') files[ih] = { complete: swarms.get(ih)?.size || 0, incomplete: 0, downloaded: 0 };
        return out(sid, { action: 'scrape', files });
      }
      if (m.action !== 'announce' || typeof m.info_hash !== 'string' || typeof m.peer_id !== 'string' || m.info_hash.length > 40 || m.peer_id.length > 40) return;
      const ih = m.info_hash, pid = m.peer_id;
      if (m.answer) {
        const to = swarms.get(ih)?.get(m.to_peer_id);
        if (to) out(to, { action: 'announce', answer: m.answer, offer_id: m.offer_id, peer_id: pid, info_hash: ih });
        return;
      }
      if (m.event === 'stopped') { leave(sid, ih); return out(sid, { action: 'announce', interval: 120, info_hash: ih, complete: 0, incomplete: 0 }); }
      if (!s.joined.has(ih) && s.joined.size >= 500) return;
      const sw = swarms.get(ih) || swarms.set(ih, new Map()).get(ih);
      sw.set(pid, sid); s.joined.set(ih, pid);
      out(sid, { action: 'announce', interval: 120, info_hash: ih, complete: sw.size, incomplete: 0 });
      if (Array.isArray(m.offers) && m.offers.length) {
        const others = [...sw].filter(([p, id]) => p !== pid && sockets.has(id));
        for (let i = others.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [others[i], others[j]] = [others[j], others[i]]; }
        others.slice(0, Math.min(m.offers.length, 20)).forEach(([, id], i) => {
          const o = m.offers[i];
          if (o && o.offer) out(id, { action: 'announce', offer: o.offer, offer_id: o.offer_id, peer_id: pid, info_hash: ih });
        });
      }
    }
  };
}

// ---- live streams. Every home node runs this hub at /live.
// The broadcaster's browser sends WebRTC to a tree of viewers: verified members of the channel (people who joined it)
// get the slots right under the broadcaster, everyone else hangs under members, and each viewer can relay to a few
// more. The hub only introduces peers and relays their WebRTC signalling. It also relays SEGMENTS: ~1 s pieces of the
// broadcaster's recording, each signed by the channel key and carrying its byte offset in the recording. Viewers whose
// WebRTC fails play the segments instead; members always receive them and write them into the channel's folder, so
// their copy is the broadcaster's recording byte for byte (with holes only for what they missed).
const LIVE = { keepMs: 60000, maxSeg: 1 << 20, srcSlots: 4, maxSlots: 6, maxDepth: 8 };
const liveSegPreimage = (g) => `opentube-live:${g.stream}:${g.n}:${g.o}:${g.h}`;   // h = sha256 hex of the bytes
const liveAuthPreimage = (nonce) => 'opentube-live-auth:' + nonce;
function createLiveHub(o) {   // o: { ownerOf(chain) -> key|null, signerOf(chain, stream) -> extra key allowed to send, isJoined(user, chain) }
  const sockets = new Map();   // sid -> { send, nonce, keys: Set, watching: Set(stream) }
  const streams = new Map();   // stream -> { chain, src, mime, seg0, segs, nodes: Map(sid -> node) }
  const out = (sid, m) => { try { sockets.get(sid)?.send(JSON.stringify(m)); } catch {} };
  const hex = (n) => [...crypto.getRandomValues(new Uint8Array(n))].map(b => b.toString(16).padStart(2, '0')).join('');
  const member = (sid, chain) => [...(sockets.get(sid)?.keys || [])].some(k => k === o.ownerOf(chain) || o.isJoined(k, chain));
  function counts(st) {
    let members = 0, rtc = 0, seg = 0;
    for (const [sid, n] of st.nodes) if (sid !== st.src) { if (n.member) members++; if (n.mode === 'rtc') rtc++; else if (n.mode === 'seg') seg++; }
    return { viewers: st.nodes.size - 1, members, rtc, seg, direct: st.nodes.get(st.src)?.children.size || 0 };
  }
  const report = (st) => out(st.src, { t: 'viewers', stream: st.id, ...counts(st) });
  function sendSegs(sid, st) { if (st.seg0) out(sid, { t: 'seg', seg: st.seg0 }); for (const g of st.segs) if (g.n !== 0) out(sid, { t: 'seg', seg: g }); }
  function detach(st, sid) {   // cut sid from its parent; its subtree stays attached to it
    const n = st.nodes.get(sid); if (!n || !n.parent) return;
    const p = st.nodes.get(n.parent); if (p) { p.children.delete(sid); out(n.parent, { t: 'unchild', stream: st.id, peer: sid }); }
    out(sid, { t: 'unparent', stream: st.id, peer: n.parent }); n.parent = null;
  }
  function subtree(st, sid, acc = new Set()) { acc.add(sid); for (const c of st.nodes.get(sid)?.children || []) subtree(st, c, acc); return acc; }
  function assign(st, sid) {
    const n = st.nodes.get(sid); if (!n) return;
    const below = subtree(st, sid);
    const free = (x, id) => (x.mode === 'src' || x.mode === 'rtc') && x.children.size < x.slots && x.depth < LIVE.maxDepth && !below.has(id);
    const src = st.nodes.get(st.src);
    if (n.member && src.children.size >= src.slots) {   // members first: move a non-member off the broadcaster
      const bump = [...src.children].find(c => !st.nodes.get(c)?.member);
      if (bump) { detach(st, bump); queueMicrotask(() => assign(st, bump)); }
    }
    const cands = [...st.nodes].filter(([id, x]) => id !== sid && free(x, id));
    cands.sort(([ia, a], [ib, b]) => (n.member ? (ib === st.src) - (ia === st.src) : (b.member - a.member)) || a.depth - b.depth || a.children.size - b.children.size);
    const pick = cands[0];
    if (!pick) { n.mode = 'seg'; out(sid, { t: 'mode', stream: st.id, mode: 'seg' }); if (!n.member) sendSegs(sid, st); return report(st); }
    const [pid, p] = pick;
    n.parent = pid; n.depth = p.depth + 1; n.mode = 'rtc'; p.children.add(sid);
    for (const c of below) if (c !== sid) st.nodes.get(c).depth = st.nodes.get(st.nodes.get(c).parent).depth + 1;
    out(sid, { t: 'parent', stream: st.id, peer: pid });
    out(pid, { t: 'child', stream: st.id, peer: sid });
    report(st);
  }
  function leave(st, sid) {
    const n = st.nodes.get(sid); if (!n) return;
    if (sid === st.src) {   // the broadcaster left: the stream is over
      for (const id of st.nodes.keys()) if (id !== sid) { out(id, { t: 'ended', stream: st.id }); sockets.get(id)?.watching.delete(st.id); }
      streams.delete(st.id); return;
    }
    detach(st, sid);
    const orphans = [...n.children]; n.children.clear();
    st.nodes.delete(sid); sockets.get(sid)?.watching.delete(st.id);
    for (const c of orphans) { const x = st.nodes.get(c); if (x) { x.parent = null; out(c, { t: 'unparent', stream: st.id, peer: sid }); assign(st, c); } }
    report(st);
  }
  function relaySeg(st, g) {
    g.at = Date.now();
    if (g.n === 0) st.seg0 = g;
    st.segs.push(g);
    while (st.segs.length && st.segs[0].at < g.at - LIVE.keepMs) st.segs.shift();
    for (const [id, n] of st.nodes) if (id !== st.src && (n.mode === 'seg' || n.member)) out(id, { t: 'seg', seg: g });
  }
  return {
    // A stream whose segments come from this node itself (OBS ingest on server.mjs). Viewers get segments.
    local(stream, chain, mime) {
      const src = 'local:' + stream;
      const st = { id: stream, chain, src, mime, seg0: null, segs: [], nodes: new Map([[src, { parent: null, children: new Set(), slots: 0, member: true, depth: 0, mode: 'src' }]]) };
      streams.set(stream, st);
      return { seg: (g) => streams.get(stream) === st && relaySeg(st, g), end: () => streams.get(stream) === st && leave(st, src) };
    },
    attach(sid, send) { const nonce = hex(16); sockets.set(sid, { send, nonce, keys: new Set(), watching: new Set() }); out(sid, { t: 'hi', nonce }); },
    detach(sid) {
      const s = sockets.get(sid); if (!s) return;
      for (const id of [...s.watching]) { const st = streams.get(id); if (st) leave(st, sid); }
      sockets.delete(sid);
    },
    stats() { return { streams: streams.size, sockets: sockets.size }; },
    live() { return [...streams.values()].map(st => ({ stream: st.id, chain: st.chain, ...counts(st) })); },
    message(sid, m) {   // one socket's messages are handled strictly in order (auth must finish before watch)
      const s = sockets.get(sid); if (!s) return Promise.resolve();
      return (s.queue = (s.queue || Promise.resolve()).then(() => handle(sid, m)).catch(() => {}));
    }
  };
  async function handle(sid, m) {
      const s = sockets.get(sid);
      if (!s || !m || typeof m !== 'object' || typeof m.t !== 'string') return;
      if (m.t === 'auth') {   // prove you hold a key (your personal key, or a channel key to broadcast)
        if (isKey(m.key) && typeof m.sig === 'string' && s.keys.size < 50 && await verify(m.key, liveAuthPreimage(s.nonce), m.sig)) s.keys.add(m.key);
        return;
      }
      if (m.t === 'seg' && m.stream === undefined) m.stream = m.seg?.stream;
      const st = isHex(m.stream, 64) ? streams.get(m.stream) : null;
      if (m.t === 'broadcast') {
        if (!isHex(m.stream, 64) || !isHex(m.chain, 64) || !isStr(m.mime, 80)) return;
        const owner = o.ownerOf(m.chain), relay = o.signerOf?.(m.chain, m.stream);
        if (!(owner && s.keys.has(owner)) && !(relay && s.keys.has(relay))) return out(sid, { t: 'error', stream: m.stream, error: 'not the owner of this channel' });
        if (st && st.chain !== m.chain) return;
        if (st && st.src !== sid) leave(st, st.src);   // a reconnecting broadcaster replaces the old connection
        const fresh = { id: m.stream, chain: m.chain, src: sid, mime: m.mime, seg0: st?.seg0 || null, segs: st?.segs || [], nodes: new Map() };
        fresh.nodes.set(sid, { parent: null, children: new Set(), slots: m.rtc === false ? 0 : Math.min(Math.max(m.slots | 0, 0), LIVE.maxSlots) || LIVE.srcSlots, member: true, depth: 0, mode: 'src' });
        streams.set(m.stream, fresh); s.watching.add(m.stream);
        return out(sid, { t: 'broadcasting', stream: m.stream });
      }
      if (m.t === 'ingest') {   // the owner asks for a stream key so OBS can send this stream to the node
        if (!o.ingest) return out(sid, { t: 'error', stream: m.stream, error: 'This home node can’t receive OBS streams (only server.mjs can).' });
        if (!isHex(m.stream, 64) || !isHex(m.chain, 64) || !isStr(m.mime, 80) || streams.has(m.stream)) return;
        const owner = o.ownerOf(m.chain);
        if (!owner || !s.keys.has(owner)) return out(sid, { t: 'error', stream: m.stream, error: 'not the owner of this channel' });
        return out(sid, { t: 'ingestkey', stream: m.stream, key: o.ingest.ticket({ stream: m.stream, chain: m.chain, mime: m.mime }), path: '/ingest/' });
      }
      if (!st) return m.t === 'watch' ? out(sid, { t: 'nostream', stream: m.stream }) : undefined;
      if (m.t === 'seg') {
        const g = m.seg;
        if (sid !== st.src || !g || g.stream !== st.id || !Number.isSafeInteger(g.n) || !Number.isSafeInteger(g.o) || typeof g.d !== 'string' || g.d.length > LIVE.maxSeg * 1.4) return;
        return relaySeg(st, g);
      }
      if (m.t === 'watch') {
        if (st.nodes.has(sid) || s.watching.size >= 20) return;
        const n = { parent: null, children: new Set(), slots: Math.min(Math.max(m.slots | 0, 0), LIVE.maxSlots), member: member(sid, st.chain), depth: 0, mode: 'pending' };
        st.nodes.set(sid, n); s.watching.add(st.id);
        out(sid, { t: 'watching', stream: st.id, mime: st.mime, member: n.member });
        if (n.member) sendSegs(sid, st);   // members save the stream: give them what we have
        if (m.segOnly) { n.mode = 'seg'; out(sid, { t: 'mode', stream: st.id, mode: 'seg' }); if (!n.member) sendSegs(sid, st); return report(st); }
        return assign(st, sid);
      }
      if (m.t === 'leave') return leave(st, sid);
      if (m.t === 'fallback') {   // WebRTC didn't work for this viewer: segments instead
        const n = st.nodes.get(sid); if (!n || n.mode === 'src') return;
        detach(st, sid);
        const orphans = [...n.children]; n.children.clear();
        for (const c of orphans) { const x = st.nodes.get(c); if (x) { x.parent = null; out(c, { t: 'unparent', stream: st.id, peer: sid }); assign(st, c); } }
        n.mode = 'seg'; out(sid, { t: 'mode', stream: st.id, mode: 'seg' }); if (!n.member) sendSegs(sid, st);
        return report(st);
      }
      if (m.t === 'signal') {   // WebRTC offer/answer/candidates, only between a parent and its child
        const a = st.nodes.get(sid), b = st.nodes.get(m.to);
        if (a && b && (a.parent === m.to || b.parent === sid) && JSON.stringify(m.data || null).length < 20000) out(m.to, { t: 'signal', stream: st.id, from: sid, data: m.data });
      }
  }
}

// Network-level enforcement: every node checks a non-owner block against the owner's
// rules as they stood in that block's own history. Blocks that fail are rejected:
// not stored, not relayed. (derive() additionally applies later revokes and "off"
// switches when displaying, so picking old parents can't dodge them.)
function permittedAt(chain, b) {
  const owner = chain.owner;
  const history = chain.ancestors(b.parents);
  const ownerBlocks = [...history].map(x => chain.blocks.get(x)).filter(x => x.author === owner && x.hash !== chain.id)
    .sort((x, y) => x.height - y.height || x.ts - y.ts || (x.hash < y.hash ? -1 : 1));
  let def = chain.genesis.payload.comments;
  const videoPolicy = new Map(), allowed = new Set(), revoked = new Set();
  for (const x of ownerBlocks) {
    const p = x.payload;
    if (p.type === 'profile' && p.comments) def = p.comments;
    if (p.type === 'video' && p.comments) videoPolicy.set(x.hash, p.comments);
    if (p.type === 'settings') { if (p.comments === 'default') videoPolicy.delete(p.target); else videoPolicy.set(p.target, p.comments); }
    if (p.type === 'allow') { allowed.add(p.key); revoked.delete(p.key); }
    if (p.type === 'revoke') { revoked.add(p.key); allowed.delete(p.key); }
  }
  if (revoked.has(b.author) || !history.has(b.payload.target)) return false;
  const target = chain.blocks.get(b.payload.target);
  if (b.payload.type === 'hide') return target.author === b.author;              // only your own comments
  if (b.payload.type === 'vote' && target.payload.type === 'comment') return true;   // likes on comments (they pay the commenter)
  if (target.author !== owner || !['video', 'live'].includes(target.payload.type)) return false;  // comments and votes attach to the channel's videos and live streams
  if (b.payload.type === 'vote') return true;                                   // anyone not revoked may vote
  const pol = videoPolicy.get(target.hash) ?? def;
  return pol === 'anyone' || (pol === 'approved' && allowed.has(b.author));
}

// What a channel/list looks like after applying every rule (permissions, hides, profile edits).
function derive(c) {
  if (c._derived && c._derived.version === c.version) return c._derived;
  const owner = c.owner;
  const blocks = [...c.blocks.values()].filter(b => b.hash !== c.id).sort((a, b) => a.height - b.height || a.ts - b.ts || (a.hash < b.hash ? -1 : 1));
  const profile = { ...c.genesis.payload };
  const allowed = new Set(), revokes = [];
  const videoPolicy = new Map();  // video block hash -> comment policy overriding the channel default
  for (const b of blocks) if (b.author === owner) {
    const p = b.payload;
    if (p.type === 'video' && p.comments) videoPolicy.set(b.hash, p.comments);
    if (p.type === 'settings') { if (p.comments === 'default') videoPolicy.delete(p.target); else videoPolicy.set(p.target, p.comments); }
    if (p.type === 'profile') for (const k of ['name', 'about', 'avatar', 'comments']) if (p[k] !== undefined) profile[k] = p[k];
    if (p.type === 'allow') allowed.add(p.key);
    if (p.type === 'revoke') { allowed.delete(p.key); revokes.push({ key: p.key, before: c.ancestors([b.hash]) }); }
  }
  // A revoke hides everything that user writes except what the owner had already seen when revoking.
  const policyFor = (target) => videoPolicy.get(target) ?? profile.comments;
  const allows = (key, target) => {
    const pol = policyFor(target);
    return pol === 'anyone' || (pol === 'approved' && allowed.has(key));
  };
  const permitted = (b) => {
    if (b.author === owner) return true;
    if (revokes.some(r => r.key === b.author && !r.before.has(b.hash))) return false;
    if (b.payload.type === 'hide' || b.payload.type === 'vote') return true;  // own-comment hides and votes need no comment permission
    return allows(b.author, b.payload.target);
  };
  const visible = blocks.filter(permitted);
  const hidden = new Set();
  for (const b of visible) if (b.payload.type === 'hide') {
    const t = c.blocks.get(b.payload.target);
    if (t && (b.author === owner || t.author === b.author)) hidden.add(t.hash);
  }
  const live = visible.filter(b => !hidden.has(b.hash));
  return (c._derived = {
    version: c.version, id: c.id, kind: c.genesis.payload.kind, owner, profile, allowed, revoked: new Set(revokes.map(r => r.key)), hidden,
    videos: live.filter(b => b.payload.type === 'video' && b.author === owner).reverse(),
    posts: live.filter(b => b.payload.type === 'post' && b.author === owner).reverse(),
    adds: live.filter(b => b.payload.type === 'add' && b.author === owner).reverse(),
    ads: live.filter(b => b.payload.type === 'ad' && b.author === owner).reverse(),
    sponsors: live.filter(b => b.payload.type === 'sponsor' && b.author === owner).reverse(),
    ...(() => {   // live streams: started, not yet ended (and less than a day old)
      const ends = new Map(), recordings = new Map();
      for (const b of live) if (b.author === owner) {
        if (b.payload.type === 'liveend') ends.set(b.payload.stream, b.payload.outcome);
        if (b.payload.type === 'video' && b.payload.stream) recordings.set(b.payload.stream, b);
      }
      const streams = live.filter(b => b.payload.type === 'live' && b.author === owner).reverse();
      return { streams, liveEnds: ends, recordings, liveNow: streams.filter(b => !ends.has(b.payload.stream) && Date.now() - b.ts < 24 * 3600000) };
    })(),
    commentsFor: (target) => visible.filter(b => b.payload.type === 'comment' && b.payload.target === target),
    votes: tallyVotes(visible),
    policyFor, videoPolicy,
    canComment: (key, target) => key === owner || (!revokes.some(r => r.key === key) && allows(key, target)),
    blockCount: c.blocks.size
  });
}

/* ---- the node engine. Host environments plug in:
     send(msg, peer?)          deliver a protocol message (no peer = everyone)
     signer {pub, sign}        this node's identity
     keyFor(pub)               signer for a channel key this node holds, or null
     mine(body, bits, onProg)  -> {promise<nonce>, cancel}
     shouldMine(genesis)       which pending registrations this node spends work on
     persist(chainId, block)   store a newly accepted block
     onBlock(chain, block)     after a block is accepted
     onChange()                something changed (UI refresh)
     trackAll                  keep every registered chain (server nodes)
   Protocol: heads {c,h} | rq {c,w,h} (empty w = "send me your heads") | bk {c,b} | mp {e} */
async function createEngine(o) {
  const stats = { started: Date.now(), msgsIn: 0, msgsOut: 0, lastMsgIn: 0, rejected: {}, events: [] };
  const logEvent = (kind, text) => { stats.events.unshift({ ts: Date.now(), kind, text }); if (stats.events.length > 200) stats.events.pop(); };
  const send = (m, to) => { stats.msgsOut++; try { o.send?.(m, to); } catch (e) { console.warn('send', e); } };
  const changed = () => o.onChange?.();
  const MAIN_ID = await hashBlock(MAIN_GENESIS);
  const CFG = MAIN_GENESIS.payload;
  const main = new Chain(MAIN_ID, { ...MAIN_GENESIS, hash: MAIN_ID });
  main.best = main.genesis;
  const chains = new Map([[MAIN_ID, main]]);
  const mempool = new Map();  // genesis hash -> genesis block awaiting registration
  const E = { MAIN_ID, CFG, main, chains, mempool, directory: new Map(), miner: null, minedHashes: 0, rankings: new Map(), memberships: new Map(), nodes: new Map(), txpool: new Map(), stats, logEvent };
  const txpool = E.txpool;

  const headsOf = (c) => c === main ? [main.best.hash] : [...c.heads];
  const genesisFor = (id) => chains.get(id)?.genesis || E.directory.get(id)?.genesis || mempool.get(id) || null;
  const announce = (c, to) => send({ t: 'heads', c: c.id, h: headsOf(c) }, to);
  const requestChain = (c, to) => { c.stats.lastRequest = Date.now(); send({ t: 'rq', c: c.id, w: [], h: headsOf(c) }, to); };
  function openChain(id) {
    if (chains.has(id)) return chains.get(id);
    const g = genesisFor(id); if (!g) return null;
    const c = new Chain(id, g); chains.set(id, c);
    return c;
  }

  // ---- main chain: proof of work; the highest chain wins (ties: lowest tip hash).
  // Blocks register channels/lists and carry ledger transactions.
  const ledgerCache = new Map();   // block hash -> Ledger after that block
  ledgerCache.set(MAIN_ID, new Ledger());
  function stateAfter(hash) {
    if (ledgerCache.has(hash)) return ledgerCache.get(hash);
    const path = []; let h = hash;
    while (!ledgerCache.has(h)) { const b = main.blocks.get(h); if (!b) return null; path.push(b); h = b.parents[0]; }
    let st = ledgerCache.get(h);
    for (const b of path.reverse()) { st = new Ledger(st); for (const t of b.payload.txs || []) st.apply(t); st.endBlock(b.author); ledgerCache.set(b.hash, st); }
    while (ledgerCache.size > 300) { const k = ledgerCache.keys().next().value; if (k === MAIN_ID) { ledgerCache.delete(k); ledgerCache.set(k, new Ledger()); } else ledgerCache.delete(k); }
    return st;
  }
  // Coin checks: confirmed, or waiting in the pool (shown right away, counted for good once mined).
  function isPaid(ref, from) {
    const p = E.ledger?.paid.get(ref); if (p) return !from || p.from === from;
    for (const t of txpool.values()) if (t.v === 2 && (t.post && 'post:' + t.post.video === ref || t.vote && 'vote:' + t.vote.target === ref || t.view && `view:${t.view.video}:${t.from}` === ref) && (!from || t.from === from)) return true;
    return false;
  }
  const postPaid = (v) => v.ts < COIN.epoch || isPaid('post:' + v.hash);   // usually the uploader pays, but anyone may
  const nameAllowed = (t) => {
    if (!t.name) return true;
    const g = genesisFor(t.name.chain);

// ---------------------------------------------------------------- live streaming (see createLiveHub in the core)
// Broadcaster: camera / OBS Virtual Camera / screen -> MediaRecorder -> ~1 s chunks. Each chunk is signed with the
// channel key, sent to the hub as a segment, and written into the recording file in the channel's folder. Viewers
// the hub assigns get the stream over WebRTC (and relay it to a few more); if that fails they play the segments.
// Members of the channel (joined) take part in the background: they relay and save every segment at its byte offset,
// so their file is the broadcaster's recording. When the streamer publishes it, they only fetch what they missed.
const { liveSegPreimage, liveAuthPreimage, verify: coreVerify } = globalThis.OpenTubeCore;

const b64 = {
  enc(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); },
  dec(s) { const b = atob(s), u8 = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u8[i] = b.charCodeAt(i); return u8; }
};

// Where a WebM cluster (a point a decoder can start from) begins inside a chunk, or -1.
function clusterAt(u8, from = 0) {
  for (let i = from; i + 6 < u8.length; i++) {
    if (u8[i] !== 0x1f || u8[i + 1] !== 0x43 || u8[i + 2] !== 0xb6 || u8[i + 3] !== 0x75) continue;
    const first = u8[i + 4]; if (!first) continue;
    const len = Math.clz32(first) - 23;   // EBML size length, 1..8
    if (u8[i + 4 + len] === 0xe7) return i;   // a cluster starts with its Timecode element
  }

const liveNet = (() => {
  let ws = null, ready = null, nonce = null;
  const handlers = new Map(), authed = new Set();
  const url = () => { const u = homeNodeUrl(); return u && !params.get('net') ? u.replace(/\/ot$/, '/live') : null; };
  const send = (m) => { if (ws?.readyState === 1) ws.send(JSON.stringify(m)); };
  async function auth(signer) {
    if (!signer || !nonce || authed.has(signer.pub)) return;
    authed.add(signer.pub); send({ t: 'auth', key: signer.pub, sig: await signer.sign(liveAuthPreimage(nonce)) });
  }
  function connect() {
    if (ready) return ready;
    ready = new Promise((res) => {
      const u = url(); if (!u) return res(false);
      try { ws = new WebSocket(u); } catch { ready = null; return res(false); }
      const failTimer = setTimeout(() => res(false), 8000);
      ws.onmessage = async (e) => {

        if (m.t === 'hi') {
          nonce = m.nonce; authed.clear();
          await auth(me); for (const s of ownedSigners.values()) await auth(s);
          clearTimeout(failTimer); res(true);
          for (const fn of handlers.values()) fn({ t: 'reconnected' });
          return;
        }

      };

function newPc() { const pc = new RTCPeerConnection({ iceServers: ICE }); pc.waiting = []; return pc; }

    else if (data.c) { if (pc.remoteDescription) await pc.addIceCandidate(data.c).catch(() => {}); else pc.waiting.push(data.c); }
  } catch (e) { console.warn('live signal', e.message); }
}

  pc.onicecandidate = (e) => { if (e.candidate) liveNet.send({ t: 'signal', stream, to: peer, data: { c: e.candidate.toJSON() } }); };
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed' || pc.connectionState === 'closed') { if (kids.get(peer) === pc) kids.delete(peer); } };
  (async () => { await pc.setLocalDescription(await pc.createOffer()); liveNet.send({ t: 'signal', stream, to: peer, data: { sdp: pc.localDescription.toJSON() } }); })().catch(e => console.warn('live offer', e.message));

}

}

// ---- broadcasting
const broadcasts = new Map();   // chainId -> session
async function startLive(chainId, media, title) {
  if (!canHost()) throw new Error('Going live needs a video folder (it records the stream there).');
  if (!LIVE_MIME) throw new Error('This browser can’t record video for streaming. Use Chrome, Edge or Firefox.');
  if (!(await liveNet.connect())) throw new Error('No home node to stream through. Open the site from its own address (not a file or ?net=p2p).');
  const d = derive(chainId), signer = signerFor(d.owner);
  await liveNet.auth(signer);
  const stream = toHex(crypto.getRandomValues(new Uint8Array(32)));
  const ch = await channelFolder(chainId);
  const file = await uniqueFileName(ch, cleanName(title, 'Live') + '.webm');
  const fh = await ch.dir.getFileHandle(file, { create: true });
  (ch.meta.lives ||= {})[stream] = { file, title, own: true, started: Date.now() }; saveMeta(ch);
  const sess = { chainId, stream, title, media, file, fh, signer, n: 0, o: 0, kids: new Map(), viewers: null, started: Date.now(), queue: Promise.resolve(), ended: false, block: null };
  sess.rec = new (fileStore(fh, false))(1, { length: Number.MAX_SAFE_INTEGER });   // writes each chunk at its offset
  broadcasts.set(chainId, sess);
  liveNet.on(stream, (m) => {
    if (m.t === 'child') offerTo(stream, m.peer, media, sess.kids);
    else if (m.t === 'unchild') { sess.kids.get(m.peer)?.close(); sess.kids.delete(m.peer); }
    else if (m.t === 'signal') { const pc = sess.kids.get(m.from); if (pc) onSignal(pc, m.data); }
    else if (m.t === 'viewers') { sess.viewers = m; scheduleRender(); }
    else if (m.t === 'reconnected' && !sess.ended) liveNet.send({ t: 'broadcast', stream, chain: chainId, mime: LIVE_MIME, slots: 4 });
    else if (m.t === 'error') toast('Live: ' + m.error);
  });
  liveNet.send({ t: 'broadcast', stream, chain: chainId, mime: LIVE_MIME, slots: 4 });
  sess.block = await append(chainId, { type: 'live', title, stream, mime: LIVE_MIME });
  const opts = { mimeType: LIVE_MIME, videoBitsPerSecond: 2_000_000, audioBitsPerSecond: 128_000, videoKeyFrameIntervalDuration: 2000 };
  const recorder = sess.recorder = new MediaRecorder(media, opts);
  recorder.ondataavailable = (e) => { if (e.data.size) sess.queue = sess.queue.then(() => pushSegment(sess, e.data)).catch(err => console.warn('live segment', err)); };
  recorder.start(1000);

}
async function pushSegment(sess, blob) {
  const u8 = new Uint8Array(await blob.arrayBuffer());
  const g = { stream: sess.stream, n: sess.n++, o: sess.o, h: await sha256Bytes(u8) };
  sess.o += u8.length;
  g.sig = await sess.signer.sign(liveSegPreimage(g));
  g.d = b64.enc(u8);
  liveNet.send({ t: 'seg', seg: g });
  await new Promise((res, rej) => sess.rec.put(g.o, u8, (e) => e ? rej(e) : res()));
}
async function stopLive(chainId) {

  sess.ended = true;
  await new Promise((res) => { sess.recorder.onstop = res; try { sess.recorder.stop(); } catch { res(); } });
  await sess.queue; await sess.rec.finish();
  liveNet.send({ t: 'leave', stream: sess.stream }); liveNet.off(sess.stream);
  for (const pc of sess.kids.values()) pc.close();
  sess.thumb = sess.preview ? makeThumb(sess.preview) : '';

// OBS with a stream key (server.mjs home nodes): OBS sends WebM to the node, which signs and relays it. This browser

const OBS_MIME = 'video/webm;codecs="vp8,vorbis"';   // Vorbis, not Opus: browsers can't stream ffmpeg's Opus-in-WebM interleaving
async function startObsLive(chainId, title) {

// The streamer's choice when it's over: publish the recording as a video, or discard it.
async function finishLive(chainId, stream, publish, fields = {}) {
  const ch = await channelFolder(chainId), rec = ch.meta.lives?.[stream];

  if (publish) {
    const fh = await ch.dir.getFileHandle(rec.file);
    const file = await fh.getFile();
    const type = /\.mp4$/i.test(rec.file) ? 'video/mp4' : 'video/webm';
    const entry = { file: rec.file, name: rec.file, type, size: file.size, complete: true, own: true, ts: Date.now() };
    const t = await seedFile(chainId, null, fh, entry, ch);
    ch.meta.videos[t.infoHash] = entry;
    const vb = await append(chainId, { type: 'video', title: (fields.title || rec.title).slice(0, LIMITS.title), desc: (fields.desc || '').slice(0, LIMITS.text), infohash: t.infoHash, file: rec.file.slice(0, 200), size: file.size, mime: type, thumb: fields.thumb || '', stream });
    try { await payPost(chainId, vb, file.size); } catch (e) { toast(`Recording posted, but not published yet: ${e.message}. Pay from your channel's Videos tab.`); }

}

// ---- ads
const { sha256hex } = globalThis.OpenTubeCore;
const nowSync = () => Date.now() + (diag.clockOffset || 0);   // the home node's clock
const sleepUntil = (t) => new Promise(r => setTimeout(r, Math.max(0, t - nowSync())));
const hexOf = (u8) => Array.from(u8, b => b.toString(16).padStart(2, '0')).join('');
const adTid = new Map();   // ad block hash -> terms id
function tidOf(block) {
  if (!adTid.has(block.hash)) { adTid.set(block.hash, null); E.termsId(block.payload.terms).then(x => { adTid.set(block.hash, x); scheduleRender(); }); }
  return adTid.get(block.hash);
}
// Advertisers whose ads run on a channel: its own sponsors plus those of any list that includes it.
function sponsorsFor(chainId) {
  const ids = new Set();
  for (const b of derive(chainId)?.sponsors || []) ids.add(b.payload.advertiser);
  for (const c of chains.values()) {
    if (c === main || c.genesis.payload.kind !== 'list') continue;
    const ld = derive(c.id);
    if (ld.adds.some(a => a.payload.target === chainId)) for (const b of ld.sponsors) ids.add(b.payload.advertiser);
  }
  return [...ids];
}
// Lists that run ads (for "where my ads run").
function whereAdsRun(advertiserId) {
  const out = [];
  for (const c of chains.values()) if (c !== main && derive(c.id)?.sponsors.some(b => b.payload.advertiser === advertiserId)) out.push(c.id);
  return out;
}
// Waits (up to ~8 s) for sponsored advertisers' chains to load, so a fresh browser still gets its ad.
async function pickAd(chainId) {
  const deadline = Date.now() + 8000;
  for (;;) {
    const advs = sponsorsFor(chainId);
    for (const a of advs) if (!chains.has(a) && genesisFor(a)) { openChain(a); E.requestChain(chains.get(a)); }
    const cands = [];
    for (const a of advs) for (const b of derive(a)?.ads || []) {
      const t = b.payload.terms, tid = await E.termsId(t);
      if ((E.ledger.adViews.get(tid) || 0) >= t.maxViews || E.ledger.balance(t.advertiser) < t.perView || isMine(t.advertiser)) continue;
      cands.push({ block: b, terms: t, tid, channel: a, name: derive(a).profile.name });
    }
    if (cands.length) return cands[Math.floor(Math.random() * cands.length)];
    // Give up early once every sponsored advertiser's chain is known to be synced (they simply have no live ads).
    const settled = advs.every(a => chains.has(a) && chains.get(a).stats.lastAnnounce && E.syncState(chains.get(a)).state === 'synced');
    if (!advs.length && derive(chainId) && E.syncState(chains.get(chainId)).state === 'synced') return null;
    if ((advs.length && settled) || Date.now() > deadline) return null;
    await new Promise(r => setTimeout(r, 400));
  }
}

// One ad viewing, synced with everyone else who starts the same ad in the same 10-second slot.
let adSession = null;
function runAd(ad, { player, panel, video, creator, alive }) {
  return new Promise(async (resolve) => {
    const t = ad.terms, slotMs = E.ADS.slotMs, p = ad.block.payload;
    const status = h('span', { class: 'sub' }), syncInfo = h('span', { class: 'sub' });
    let skipped = false, ended = false;
    const finish = (res) => { if (ended) return; ended = true; adSession = null; resolve(res); };
    const skip = h('button', { class: 'small', style: 'visibility:hidden', onclick: () => { skipped = true; player.pause(); finish({ ok: false, text: 'Ad skipped: this view earns nothing.' }); } }, 'Skip ad');
    panel.replaceChildren(h('div', { class: 'row', style: 'justify-content:space-between' },
      h('div', {}, h('span', { class: 'badge warn' }, 'Ad'), ' ', h('b', {}, p.title), h('span', { class: 'sub' }, ' · ' + ad.name),
        p.url ? h('a', { href: p.url, target: '_blank', rel: 'noopener noreferrer nofollow', style: 'margin-left:10px' }, 'Visit advertiser ↗') : null),
      skip), h('div', { style: 'margin-top:6px' }, status, ' ', syncInfo));
    status.textContent = 'Loading ad…';
    // 1. The ad file itself (it's small); we need its bytes to prove we're playing it.
    const tor = getTorrent(t.infohash) || wt.add(magnet(t.infohash, p.file), { announce: TRACKERS });
    const blob = await new Promise((res) => {
      const go = () => { const f = tor.files[0]; const done = () => f.blob().then(res, () => res(null)); tor.done ? done() : tor.once('done', done); };
      tor.ready ? go() : tor.once('ready', go);
      setTimeout(() => res(null), 20000);
    });
    if (!alive() || ended) return finish({ ok: false, text: '' });
    if (!blob || blob.size !== t.size) return finish({ ok: false, text: 'The ad could not be loaded (no peer has it), so it was skipped.' });
    // 2. Join the group for the next slot.
    const slot = Math.ceil((nowSync() + 1500) / slotMs), start = slot * slotMs;
    const session = await E.sessionId(ad.tid, slot);
    const mine_ = new Map();
    const hashAt = async (i) => {
      if (!mine_.has(i)) { const off = Math.floor(i * t.size / t.duration); mine_.set(i, sha256hex(session + ':' + i + ':' + hexOf(new Uint8Array(await blob.slice(off, off + 1024).arrayBuffer())))); }
      return mine_.get(i);
    };
    const matches = new Map(), witnesses = new Map();
    adSession = { session, onMessage: async (m) => {
      if (!m || m.s !== session) return;
      if (m.w && isKey(m.w.witness) && m.w.witness !== me.pub && m.w.session === session && Array.isArray(m.w.saw) && m.w.saw.includes(me.pub)) witnesses.set(m.w.witness, m.w);
      if (isKey(m.k) && m.k !== me.pub && Number.isSafeInteger(m.i) && m.i >= 0 && m.i < t.duration && typeof m.h === 'string') {
        const late = Math.abs(nowSync() - (start + m.i * 1000));
        if (late <= 3000 && m.h === await hashAt(m.i)) (matches.get(m.k) || matches.set(m.k, new Set()).get(m.k)).add(m.i);
      }
    } };
    const need = Math.ceil(t.duration * E.ADS.syncRatio);
    const inSync = () => [...matches.values()].filter(x => x.size >= Math.min(need, 1)).length;
    while (nowSync() < start - 200 && alive() && !ended) { status.textContent = `Ad starts in ${Math.ceil((start - nowSync()) / 1000)} s · syncing with other viewers of this ad…`; await new Promise(r => setTimeout(r, 250)); }
    if (!alive() || ended) return finish({ ok: false, text: '' });
    // 3. Play it, and every second publish a hash of the ad bytes for that second.
    player.src = URL.createObjectURL(blob);
    player.play().catch(() => { player.muted = true; player.play().catch(() => {}); });
    setTimeout(() => { skip.style.visibility = 'visible'; }, 5000);
    let sent = 0;
    for (let i = 0; i < t.duration; i++) {
      await sleepUntil(start + i * 1000 + 300);
      if (!alive() || ended) return finish({ ok: false, text: '' });
      if (!player.paused && player.currentTime >= i - 1.5 && document.visibilityState === 'visible') { E.send({ t: 'watch', s: session, k: me.pub, i, h: await hashAt(i) }); sent++; }
      status.textContent = `Ad · ${t.duration - i} s left`;
      syncInfo.textContent = `· in sync with ${inSync()} other viewer(s)`;
    }
    await sleepUntil(start + t.duration * 1000 + 2000);
    if (!alive() || ended) return finish({ ok: false, text: '' });
    // 4. Sign what we saw; collect what others saw about us.
    const saw = [...matches].filter(([, x]) => x.size >= need).map(([k]) => k);
    if (sent >= need) E.send({ t: 'watch', s: session, w: await E.signWitness({ v: 1, kind: 'witness', session, terms: ad.tid, slot, video, creator, witness: me.pub, saw }) });
    status.textContent = 'Ad finished · collecting confirmations from the other viewers…'; syncInfo.textContent = '';
    await new Promise(r => setTimeout(r, 4000));
    if (!alive()) return finish({ ok: false, text: '' });
    const ws = [...witnesses.values()].slice(0, E.ADS.maxWitnesses);
    if (sent < need) return finish({ ok: false, text: 'Not counted: the ad was not playing (and visible) for enough of the time.' });
    if (ws.length < E.ADS.minWitnesses) return finish({ ok: false, text: `Not counted: no other viewer watched this ad in sync with you (needs ${E.ADS.minWitnesses}). Views are verified by other viewers.` });
    try {
      await E.submitTx({ claim: { terms: t, slot, video, creator, witnesses: ws } });
      const half = Math.floor(t.perView / 2);
      finish({ ok: true, text: `✅ View verified by ${ws.length} other viewer(s). You earn ${half} ${ad.name} tokens and the video’s creator earns ${t.perView - half} once the claim is mined.` });
    } catch (e) { finish({ ok: false, text: 'Claim rejected: ' + e.message }); }
  });
}

  const name = h('input', { type: 'text', maxLength: LIMITS.name, placeholder: 'Name' });
  const about = h('textarea', { maxLength: LIMITS.about, placeholder: 'What is it about?' });
  const policy = h('select', {}, [['anyone', 'Anyone can comment'], ['approved', 'Only approved users'], ['off', 'Comments off']].map(([v, l]) => h('option', { value: v }, l)));
  const avatarIn = h('input', { type: 'file', accept: 'image/*' });
  const chanOnly = h('div', {}, h('label', {}, 'Avatar'), avatarIn, h('label', {}, 'Comments'), policy);
  kind.onchange = () => chanOnly.classList.toggle('hidden', kind.value !== 'channel');
  const create = h('button', { class: 'primary' }, 'Create & register');
  create.onclick = async () => {
    if (!name.value.trim()) return toast('Give it a name');
    create.disabled = true;
    const payload = { type: 'genesis', kind: kind.value, name: name.value.trim(), about: about.value.trim() };
    if (kind.value === 'channel') { payload.avatar = avatarIn.files[0] ? await imageFileToDataUrl(avatarIn.files[0]) : ''; payload.comments = policy.value; }
    let g;
    try {
      const key = await newIdentity();           // a fresh key pair just for this channel/list
      await addChannelKey({ ...key, name: payload.name });
      g = await E.createGenesis(payload, ownedSigners.get(key.pub));
      await addChannelKey({ ...key, chain: g.hash });
    } catch (e) { create.disabled = false; return toast(e.message); }
    kv.set('pending', [...mempool.values()].filter(x => isMine(x.author)));
    toast('Created with its own key. Back it up from My node → Back up all keys.');
    location.hash = `#/c/${g.hash}`;
  };
  const nameIn = h('input', { type: 'text', value: settings.name, maxLength: LIMITS.name });
  const cap = h('input', { type: 'number', min: 1, max: 1000, value: settings.hostCapGB });
  const importIn = h('input', { type: 'file', accept: 'application/json', class: 'hidden' });
  importIn.onchange = async () => { const f = importIn.files[0]; importIn.value = ''; if (f) await importKeyFile(await f.text()); };
  const unbacked = owned.filter(id => !keyExported(genesisFor(id).author)).length + (personalExported ? 0 : 1);
  return h('div', {},
    h('h2', { style: 'margin-top:0' }, 'My node'),
    h('div', { class: 'panel', style: unbacked ? 'border-color:var(--warn)' : '' },
      h('div', { class: 'row', style: 'justify-content:space-between' }, h('h3', { style: 'margin:0' }, 'Keys & backup'),
        unbacked ? h('span', { class: 'badge warn' }, `${unbacked} key${unbacked === 1 ? '' : 's'} not backed up`) : h('span', { class: 'badge ok' }, 'all keys backed up')),
      h('p', { class: 'sub' }, 'Your keys exist only in this browser. Whoever holds a channel’s private key controls that channel. “Back up all keys” saves your personal key and every channel and list key in one file. “Import keys” accepts that file, or any single key file, on another browser.'),
      h('div', { class: 'row' },
        h('button', { class: 'primary', onclick: backupAllKeys }, 'Back up all keys'),
        h('button', { onclick: () => importIn.click() }, 'Import keys'), importIn)),
    folderPanel(),
    (() => { const b = keep('nodes', () => nodesPanel()); b.refresh(); return b; })(),
    h('div', { class: 'panel' }, h('h3', { style: 'margin-top:0' }, 'Your channels & lists'),
      owned.length ? owned.map(id => { const owner = genesisFor(id).author; return h('div', { class: 'row' }, h('div', { style: 'flex:1;min-width:220px' }, chanRow(id)),
        h('span', { class: 'sub' }, owner === me.pub ? 'personal key' : 'own key'),
        h('button', { class: 'small', onclick: () => exportChannelKey(id) }, keyExported(owner) ? 'Export key' : 'Export key ⚠')); })
        : h('div', { class: 'sub' }, 'None yet. Create one below, or import a key.')),
    h('div', { class: 'split' },
      h('div', { class: 'panel' }, h('h3', { style: 'margin-top:0' }, 'Your user ID'),
        h('p', { class: 'sub' }, 'Your personal public key. It identifies you when you comment, and it’s what you give a server to host for you. The private half is included in “Back up all keys”.'),
        h('div', { class: 'mono', style: 'padding:8px;background:var(--panel-2);border-radius:6px' }, me.pub),
        h('div', { class: 'row', style: 'margin-top:10px' },
          h('button', { onclick: () => navigator.clipboard?.writeText(me.pub).then(() => toast('User ID copied')) }, 'Copy user ID')),
        h('p', { class: 'sub' }, E.memberships.get(me.pub) ? `Your joined-channel list was last published ${ago(E.memberships.get(me.pub).at)}. Your nodes follow it. Note: this list is public.` : 'You haven’t joined any channels yet.'),
        h('label', {}, 'Display name for comments'), nameIn,
        h('label', {}, 'Storage limit per joined channel (GB)'), cap,
        h('button', { style: 'margin-top:10px', onclick: () => { settings.name = nameIn.value.trim().slice(0, LIMITS.name) || settings.name; settings.hostCapGB = Math.max(1, Number(cap.value) || 5); saveSettings(); toast('Saved'); } }, 'Save')),
      h('div', { class: 'panel' }, h('h3', { style: 'margin-top:0' }, 'Create a channel or list'),
        h('p', { class: 'sub' }, `This creates a new key pair and a new chain whose genesis block it signs. The whole genesis block is embedded in a main-chain block, which your browser mines (proof of work, ${CFG.difficulty} bits). That usually takes seconds to a minute.`),
        h('label', {}, 'Type'), kind, h('label', {}, 'Name'), name, h('label', {}, 'About'), about, chanOnly,
        h('div', { style: 'margin-top:12px' }, create))),
    h('div', { class: 'panel' }, h('h3', { style: 'margin-top:0' }, 'Subscriptions'), Object.keys(subs).length ? Object.keys(subs).map(chanRow) : h('div', { class: 'sub' }, 'None yet.')),
    h('div', { class: 'panel' }, h('h3', { style: 'margin-top:0' }, 'Node'),
      h('div', { class: 'kv' },
        h('div', {}, 'Network ID'), h('div', { class: 'mono' }, MAIN_ID),
        h('div', {}, 'Main chain'), h('div', {}, `height ${main.best.height}, ${main.blocks.size} blocks stored, tip ${main.best.hash.slice(0, 16)}…`),
        h('div', {}, 'Difficulty'), h('div', {}, `${CFG.difficulty} bits (main) · ${CFG.commentDifficulty} bits (other people's blocks)`),
        h('div', {}, 'Chains loaded'), h('div', {}, String(chains.size)),
        h('div', {}, 'Peers'), h('div', {}, net.status()),
        h('div', {}, 'Videos hosted'), h('div', {}, `${hosting.size} (${fmtBytes([...hosting.values()].reduce((s, x) => s + x.size, 0))})`),
        h('div', {}, 'Trackers'), h('div', { class: 'mono' }, TRACKERS.join(' ')))));
} };

uiReady = true;
render(true);
window.addEventListener('beforeunload', (e) => { if (E.miner || hosting.size) { e.preventDefault(); e.returnValue = ''; } });
// Exposed for debugging in the console.
window.opentube = { me, engine: E, net, wt, live: { broadcasts, viewing, hub: liveNet } };

// ---------------------------------------------------------------- connect
if (params.get('net') === 'local') startLocal();
else {
  const url = params.get('net') === 'p2p' ? null : homeNodeUrl();
  if (!(url && await connectHome(url))) startP2P();
}

// ---------------------------------------------------------------- mirror mode
// ?mirror=<user ID> turns this page into that person's always-on host (e.g. headless Chromium on a
// server, see headless.mjs). It follows the person's signed membership list and joins exactly the
// channels they joined; when they leave a channel it leaves too and frees the space.
// ?cap=<GB> sets the storage limit per channel.
if (params.get('cap')) settings.hostCapGB = Math.max(1, Number(params.get('cap')) || settings.hostCapGB);
if (MIRROR) {
  let applied = 0;
  const apply = async () => {
    const m = E.memberships.get(MIRROR);
    if (!m || m.at === applied) return;
    applied = m.at;
    const want = new Set(m.joined);
    for (const id of want) if (subs[id] !== 'join' && (genesisFor(id) || E.directory.has(id))) setSub(id, 'join');
    for (const id of joinedList()) if (!want.has(id)) {
      setSub(id, null);
      // Free the space: drop the videos we were hosting for that channel.
      const ch = folder.channels.get(id);
      if (ch) { for (const ih of Object.keys(ch.meta.videos)) await removeVideo(id, ih); setTimeout(() => folder.root.removeEntry(ch.folderName, { recursive: true }).catch(() => {}), 1000); folder.channels.delete(id); }
    }
    console.log(`opentube-mirror following ${MIRROR.slice(0, 8)}… : ${want.size} channel(s) joined`);
  };
  const report = () => console.log('opentube-status ' + JSON.stringify({
    net: net.status(), height: main.best.height, mirror: MIRROR, found: E.memberships.has(MIRROR), channels: joinedList().length,
    hosting: hosting.size, hostedBytes: [...hosting.values()].reduce((s, x) => s + x.size, 0), downloading: fetching.size,
    peers: wt.torrents.reduce((n, t) => n + t.numPeers, 0), up: Math.round(wt.uploadSpeed), down: Math.round(wt.downloadSpeed)
  }));
  const tick = () => { E.requestMembership(MIRROR); apply(); };
  tick();
  setInterval(tick, 15000);
  setInterval(apply, 2000);
  setInterval(report, 30000);
  setTimeout(report, 3000);
} else if (joinedList().length || E.memberships.has(me.pub)) {
  publishMyMembership();   // make sure the network has my current list
}
</script>
</body>
</html>
